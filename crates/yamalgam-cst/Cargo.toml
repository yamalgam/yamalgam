[package]
name = "yamalgam-cst"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lossless concrete syntax tree for YAML"
publish = false

[dependencies]
ropey = { version = "1.6.1", default-features = false, features = ["cr_lines", "simd"] }
rowan = "0.16.1"
yamalgam-core = { path = "../yamalgam-core" }
yamalgam-parser = { path = "../yamalgam-parser" }
yamalgam-scanner = { path = "../yamalgam-scanner" }

[dev-dependencies]
yamalgam-resolve = { path = "../yamalgam-resolve" }

[lints]
workspace = true
