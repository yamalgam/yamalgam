  notes: >-
    `.config/nextest.toml` is present; `just test` invokes `cargo nextest run`.
    Do not invoke `cargo test` directly because env-mutating tests assume nextest
    process isolation. The signed audited commit passed `just check` immediately
    before this static audit: warning-denied clippy, Cargo Deny with all features,
    1,928 nextest tests, and doc tests. The focused static run also passed Cargo
    Audit, Cargo Machete, and cargo-udeps. The supply-chain surface inspected all
    normal, all-feature, and fuzz manifests but did not rerun cargo-bloat; binary-
    size criteria rely on dependency provenance and prior profiles rather than a
    new measurement at this commit.
