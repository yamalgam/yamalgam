  - slug: cst-to-text-grows-output-without-known-capacity
    verdict: disputed
    notes: >-
      `String::new` alone does not prove material cost, and public mutable spans
      are not a sound capacity bound. A tiny token can carry an enormous span,
      so the proposed reservation could itself create excessive allocation.
