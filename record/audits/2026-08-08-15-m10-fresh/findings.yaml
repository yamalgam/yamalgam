    findings:
      - slug: scanner-never-populates-atom-presentation-metadata
        title: "Scanner exposes atom metadata but always returns defaults"
        criterion: "FC-1"
        surface: "Completeness"
        concern: moderate
        locations:
          - path: crates/yamalgam-scanner/src/scanner.rs
            start_line: 290
            end_line: 307
          - path: docs/decisions/0002-preserve-atom-concept-for-cst-fidelity.md
            start_line: 15
            end_line: 17
          - path: docs/decisions/0002-preserve-atom-concept-for-cst-fidelity.md
            start_line: 27
            end_line: 34
        evidence: |
          /// Build a scalar token with owned or borrowed data and explicit style.
          fn scalar_token(
              data: Cow<'input, str>,
              style: ScalarStyle,
              start: yamalgam_core::Mark,
              end: yamalgam_core::Mark,
          ) -> Token<'input> {
              Token {
                  kind: TokenKind::Scalar,
                  atom: Atom {
                      data,
                      span: Span { start, end },
                      style,
                      chomp: Chomp::default(),
                      flags: AtomFlags::empty(),
                  },
              }
          }
        evidence_lang: rust
        evidence_markers:
          - lines: "14-15"
            type: mark
            label: "Scalar metadata is always defaulted"
        mechanism: |
          ADR-0002 says atom style, chomp, and content flags survive scanning so
          consumers can reconstruct presentation and use direct-output paths. All
          scalar construction passes through `scalar_token`, which hard-codes the
          chomp and flags. The block-scalar scanner computes a chomp indicator but
          does not pass it through. Public scanner consumers therefore cannot
          distinguish clip, strip, and keep metadata or observe documented flags.
        remediation: |
          Preserve the computed chomp value when constructing block-scalar atoms and
          derive `AtomFlags` from scalar content and scanner context. Thread the
          metadata through any documented emitter fast path, with regressions for
          `|-`, `|`, `|+`, whitespace, line breaks, and direct-output flag cases.
        temporal:
          introduced: 2026-03-06
          last_modified: 2026-08-08
          commit_count: 38
          monthly_commits: [0, 0, 0, 0, 0, 0, 35, 0, 0, 1, 0, 2]
        chains:
          enables: []
          enabled_by: []
          related: []
        effort: medium
        effort_notes: "Scanner construction and downstream metadata tests must be completed together."

