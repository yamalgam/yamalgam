        evidence: |
          /// Parse a `=VAL` line remainder into a Scalar [`EventSnapshot`].
          ///
          /// The remainder has the form: `[&anchor] [<tag>] STYLE_CHAR value`
          /// where `STYLE_CHAR` is one of `:`, `'`, `"`, `|`, `>`.
          fn parse_val(rest: &str) -> Option<EventSnapshot> {
              let (anchor, tag, after_props) = parse_val_properties(rest);

              // The next character is the style indicator, followed by the raw value.
              if after_props.is_empty() {
                  return None;
              }

              let value = &after_props[1..]; // everything after the style char
              let decoded = unescape_tree_value(value);
        evidence_lang: rust
        evidence_markers:
          - lines: "13"
            type: del
            label: "Byte 1 may split a UTF-8 character"
        mechanism: |
          `parse_tree("=VALé")` reaches `parse_val` with `after_props` equal to
          `"é"`. The non-empty check succeeds, but byte offset 1 falls inside the
          two-byte character. The slice panics instead of rejecting the malformed
          external tree-format line.
        remediation: |
          Parse and validate the documented ASCII style character explicitly.
          Slice at the returned character boundary, or return `None` for an
          unsupported style, and add a multibyte regression.
