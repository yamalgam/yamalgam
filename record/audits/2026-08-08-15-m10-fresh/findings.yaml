      - slug: resource-limit-checks-return-unstructured-strings
        title: "Public resource-limit checks erase structured limit details into strings"
        criterion: "5.4"
        surface: "Error Handling"
        concern: moderate
        locations:
          - path: crates/yamalgam-core/src/loader.rs
            start_line: 224
            end_line: 234
        evidence: |
          /// Check whether `depth` is within [`max_depth`](Self::max_depth).
          ///
          /// Returns `Ok(())` if the limit is `None` or `depth <= max`.
          ///
          /// # Errors
          ///
          /// Returns `Err` with a human-readable message when `depth` exceeds the
          /// configured maximum.
          pub fn check_depth(&self, depth: usize) -> Result<(), String> {
              check_limit(depth, self.max_depth, "depth")
          }
        evidence_lang: rust
        evidence_markers:
          - lines: "9"
            type: mark
            label: "Public boundary returns String"
        mechanism: |
          `ResourceLimits` exposes its failure contract as `String`. Callers
          cannot inspect the breached limit, observed value, or configured maximum
          without parsing display text. The other public check methods repeat this
          signature, so downstream consumers wrap opaque messages rather than
          preserving structured limit fields.
        remediation: |
          Introduce a public limit error carrying the limit category, observed
          value, and configured maximum. Return it from each check method and
          preserve it as a source or typed payload through consumer error types.
        temporal:
