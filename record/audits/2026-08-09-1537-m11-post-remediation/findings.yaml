    findings:
      - slug: caught-resolution-errors-accumulate-until-run-end
        title: "Caught resolution errors accumulate in thread-local storage"
        concern: moderate
        locations:
          - path: crates/yamalgam-query/src/runtime_resolution.rs
            start_line: 142
            end_line: 185
        evidence: |
          pub struct Guard {
              pending: HashMap<u64, ResolveError>,
          }

          pub fn activate() -> Guard {
              ACTIVE_GUARDS.with(|guards| guards.set(guards.get().saturating_add(1)));
              Guard {
                  pending: PENDING_ERRORS.with(|errors| errors.replace(HashMap::new())),
              }
          }

          pub fn jaq_error(error: ResolveError) -> jaq_core::Error<YamlVal> {
              let message = error.to_string();
              let mut value = YamlVal::str(format!("external resolution failed: {message}"));
              let token = ACTIVE_GUARDS.with(|guards| guards.get() > 0).then(|| {
                  NEXT_ERROR_TOKEN
                      .fetch_update(Ordering::Relaxed, Ordering::Relaxed, |current| {
                          current.checked_add(1)
                      })
                      .ok()
              });
              let token = token.flatten();
              if let Some(token) = token {
                  value.runtime_error_token = Some(token);
                  PENDING_ERRORS.with(|errors| {
                      errors.borrow_mut().insert(token, error);
                  });
              }
              jaq_core::Error::new(value)
          }

          pub fn take_error(value: &YamlVal) -> Option<ResolveError> {
              let token = value.runtime_error_token?;
              PENDING_ERRORS.with(|errors| errors.borrow_mut().remove(&token))
          }

          impl Drop for Guard {
              fn drop(&mut self) {
                  PENDING_ERRORS.with(|errors| {
                      errors.replace(std::mem::take(&mut self.pending));
                  });
                  ACTIVE_GUARDS.with(|guards| guards.set(guards.get().saturating_sub(1)));
              }
          }
        evidence_lang: rust
        evidence_markers:
          - lines: "23-27"
            type: del
            label: "Every failure inserts a retained structured error"
          - lines: "32-35"
            type: mark
            label: "Removal requires the error to escape the filter"
          - lines: "37-43"
            type: mark
            label: "Caught errors clear only when the run ends"
        mechanism: |
          jaq catch can consume an error and produce a fallback without returning the
          token-bearing value to the engine. The map entry is never removed by
          take_error and remains until Guard drops. A filter that repeatedly catches
          failed ref or include operations can retain one structured error per attempt
          for the duration of the run.
        remediation: |
          Store the structured error directly in a hidden reference-counted YamlVal
          payload excluded from equality and hashing. If the side channel remains, add
          bounded storage and catch-aware reclamation. Add a stress regression with a
          test-only pending-entry counter.
        effort: medium
        effort_notes: "The direct-payload design touches YamlVal cloning and error propagation semantics."

      - slug: post-resolution-conversion-drops-session-report
        title: "Post-resolution conversion failures discard the session report"
        concern: moderate
        locations:
          - path: crates/yamalgam-query/src/resolution.rs
            start_line: 119
            end_line: 137
        evidence: |
          let document = OwnedDocument::from_events(root.clone(), events)
              .map_err(|error| YgError::InputParse(error.to_string()))?;
          let mut resolver = SessionQueryResolver::new(retriever, config.clone(), Some(root));
          let document = match resolver.resolve_input(document) {
              Ok(document) => document,
              Err(error) => {
                  let message = error.to_string();
                  return Err(YgError::input_resolution(
                      error,
                      message,
                      vec![resolver.into_report()],
                  ));
              }
          };
          let value = value_from_owned_node(document.root, ResolutionSessionKey::UNREGISTERED, config)?;
          Ok(ResolvedInput {
              value,
              resolution: Rc::new(RefCell::new(resolver)),
          })
        evidence_lang: rust
        evidence_markers:
          - lines: "4-13"
            type: mark
            label: "Resolver failures retain the report"
          - lines: "15"
            type: del
            label: "Conversion failures drop the live resolver and report"
        mechanism: |
          Successful external resolution can produce a combined tree that fails later
          value conversion, such as when an individually valid imported subtree exceeds
          configured value depth after insertion into a nested root. The question-mark
          return drops the resolver, making the accumulated report unavailable. The
          multi-document variant has the same conversion path and can also lose prior
          document reports.
        remediation: |
          Preserve reports on every error after session creation. Introduce an input
          post-resolution error wrapper carrying the structured conversion error and all
          completed/current ResolutionReports, and use it in both entry points. Test a
          nested import whose combined output exceeds max_depth.
        effort: medium
        effort_notes: "Both resolution entry points and public error/report accessors must change consistently."

      - slug: direct-include-preflight-can-omit-the-failed-report-edge
        title: "Direct include preflight failures can disappear from ResolutionReport"
        concern: moderate
        locations:
          - path: crates/yamalgam-resolve/src/session.rs
            start_line: 408
            end_line: 435
          - path: crates/yamalgam-resolve/src/session.rs
            start_line: 483
            end_line: 501
        evidence: |
          let first_edge = self.report.edges().len();
          let collection_edge = match &spec.selector {
              IncludeSelector::Path(_) => None,
              IncludeSelector::Glob(pattern) | IncludeSelector::Dir(pattern) => {
                  Some(self.report.record_edge(ResolutionEdge {
                      parent: directive.origin.clone(),
                      child: None,
                      capability: ResolutionCapability::Include,
                      source_span: directive.span,
                      requested: pattern.clone(),
                      fragment: Fragment::Root,
                      matches: Vec::new(),
                      cache_hit: false,
                      fetched_bytes: 0,
                      materialized_bytes: 0,
                      outcome: ResolutionOutcome::Resolved,
                  }))
              }
          };
          let result = self.resolve_include_inner(directive, spec, context, trigger, collection_edge);
          if let Err(error) = &result {
              let failed_edge = collection_edge.or_else(|| {
                  (self.report.edges().len() > first_edge).then(|| self.report.edges().len() - 1)
              });
              if let Some(failed_edge) = failed_edge {
                  self.report.edge_mut(failed_edge).outcome =
                      ResolutionOutcome::Failed(error_category(error));
              }
        evidence_lang: rust
        evidence_markers:
          - lines: "2-3"
            type: mark
            label: "Path includes begin without an edge"
          - lines: "20-28"
            type: del
            label: "Failure is recorded only if inner resolution added an edge"
        mechanism: |
          Path includes perform target-resource preflight before resolve_requested
          records a resource edge. A relative path on an anonymous origin produces an
          underlying ResourceError::MissingBase that this preflight wraps as
          InvalidResource, leaving both collection_edge and the post-entry lookup empty.
          The caller receives an error, but the failure report has no source edge for the
          attempted directive.
        remediation: |
          Record a sanitized path edge before target-resource preflight and update that
          exact edge on every failure. Route path identity creation through the shared
          requested-reference helper so the stable MissingBase category is preserved.
        effort: small
        effort_notes: "Move direct-path edge creation before preflight and assert the anonymous-base report."

