        label: "Materialize result"
        type: end
    findings:
      - slug: resolution-cache-bypasses-session-byte-budget
        title: "Resolution caches bypass the session-wide byte budget"
        concern: significant
        locations:
          - path: crates/yamalgam-resolve/src/session.rs
            start_line: 870
            end_line: 899
          - path: crates/yamalgam-resolve/src/session.rs
            start_line: 60
            end_line: 71
          - path: crates/yamalgam-core/src/loader.rs
            start_line: 455
            end_line: 465
        evidence: |
          let retrieved = self
              .retriever
              .retrieve(&ResourceRequest {
                  id: requested.clone(),
                  max_bytes: self.config.limits.max_input_bytes,
              })
              .map_err(|source| {
                  self.error(
                      retrieve_category(&source),
                      capability,
                      span,
                      requested.to_string(),
                      Some(Box::new(source)),
                  )
              })?;
          let fetched_bytes = retrieved.bytes.len();
          let canonical = retrieved.id;
          if &canonical != requested {
              self.aliases.insert(requested.clone(), canonical.clone());
          }
          self.report.record_resource(ResourceRecord {
              id: canonical.clone(),
              kind: resource_kind(&canonical),
              fetched_bytes,
              cache_hits: 0,
              provenance: retrieved.provenance,
          });
          let bytes: Arc<[u8]> = Arc::from(retrieved.bytes);
          self.raw_cache.insert(canonical.clone(), Arc::clone(&bytes));
          Ok((bytes, canonical, false, fetched_bytes))
        evidence_lang: rust
        evidence_markers:
          - lines: "3-6"
            type: mark
            label: "Every resource receives the full per-input ceiling"
          - lines: "28-30"
            type: mark
            label: "Fetched bytes are cached without a session-total charge"
        mechanism: |
          Edge and materialized-byte counters do not account for retained transport
          or parse-cache storage. Each unique resource may consume the complete
          max_input_bytes allowance, after which raw bytes remain cached alongside an
          OwnedDocument or Arc<str>. A reference can select a tiny fragment from a
          large resource, so little is charged to max_materialized_bytes while the
          complete resource remains resident. Under moderate defaults, 256 unique
          edges may each fetch 256 MiB: about 64 GiB of raw cache before parsed data.
        remediation: |
          Add a session-wide fetched/cache byte limit and charge it before accepting
          or parsing retrieved bytes. Avoid retaining raw bytes after building a typed
          cache unless another format still needs them, or conservatively account raw,
          text, and parsed representations. Test many large resources that expose only
          small selected fragments.
        effort: medium
        effort_notes: "Requires checked accounting, cache-lifetime changes, presets, and documentation."

      - slug: glob-discovery-scans-entire-base
        title: "Filesystem discovery visits and buffers unbounded entries"
        concern: moderate
        locations:
          - path: crates/yamalgam-resolve/src/retriever/file.rs
            start_line: 373
            end_line: 388
          - path: crates/yamalgam-resolve/src/retriever/file.rs
            start_line: 230
            end_line: 241
          - path: crates/yamalgam-resolve/src/retriever/mod.rs
            start_line: 58
            end_line: 67
        evidence: |
          match &request.selector {
              DiscoverySelector::Glob { pattern } => {
                  reject_escaping_pattern(pattern, &request.base)?;
                  let glob = compile_globs(std::slice::from_ref(pattern))?;
                  let matcher = |candidate: &Path, _name: &OsStr| {
                      candidate
                          .strip_prefix(parent)
                          .is_ok_and(|relative| glob.is_match(relative))
                  };
                  let mut state = WalkState {
                      recursive: true,
                      matcher: &matcher,
                      maximum: request.max_matches,
                      matches: &mut matches,
                  };
                  self.walk(&canonical_parent, parent, &mut state)?;
        evidence_lang: rust
        evidence_markers:
          - lines: "10-16"
            type: del
            label: "Every glob enables a full recursive walk"
        mechanism: |
          Glob discovery always begins at the containing directory and recurses even
          for patterns that cannot match below it. max_matches limits only approved
          matches; it does not limit visited directories or non-matching entries. The
          walker also collects and sorts every entry in each directory before matching.
          Untrusted YAML with filesystem capability can therefore force traversal and
          buffering of an arbitrarily large allowed tree without consuming edge budget.
        remediation: |
          Derive the static directory prefix and required recursion depth from the glob.
          Add a discovery visit budget that counts directories and entries, including
          non-matches, and enforce it while iterating. Preserve deterministic ordering
          within the bounded search.
        effort: medium
        effort_notes: "Requires bounded traversal accounting, glob-prefix analysis, and focused tests."
        chains:
          enables: []
          enabled_by: []
          related: [symlink-aliases-consume-match-limit-before-deduplication]

      - slug: symlink-aliases-consume-match-limit-before-deduplication
        title: "Symlink aliases can falsely exceed the discovery match ceiling"
        concern: moderate
        locations:
          - path: crates/yamalgam-resolve/src/retriever/file.rs
            start_line: 179
            end_line: 197
          - path: crates/yamalgam-resolve/src/retriever/file.rs
            start_line: 419
            end_line: 420
        evidence: |
          fn record_match(
              &self,
              requested: &Path,
              canonical: PathBuf,
              maximum: Option<usize>,
              matches: &mut Vec<PathBuf>,
          ) -> Result<(), RetrieveError> {
              self.approved(requested)?;
              self.approved(&canonical)?;
              matches.push(canonical);
              if let Some(maximum) = maximum
                  && matches.len() > maximum
              {
                  return Err(RetrieveError::TooManyMatches {
                      observed: maximum.saturating_add(1),
                      maximum,
                  });
              }
              Ok(())
        evidence_lang: rust
        evidence_markers:
          - lines: "10-17"
            type: del
            label: "Canonical duplicates are counted before final deduplication"
        mechanism: |
          With symlink following enabled, one canonical file can be reached through
          its real directory and multiple alias directories. Each occurrence pushes
          the same path and checks matches.len(); sorting and deduplication happen only
          after the walk. A ceiling of one can reject two aliases to one unique resource
          although the returned match set would contain one ResourceId.
        remediation: |
          Track approved canonical matches in an ordered set during traversal and apply
          max_matches only to newly inserted unique identities. Continue evaluating
          every alias path independently for policy checks.
        effort: small
        effort_notes: "Add canonical membership accounting and a multi-alias ceiling regression."
        chains:
          enables: []
          enabled_by: []
          related: [glob-discovery-scans-entire-base]

