    findings:
      - slug: relative-includes-can-retrieve-non-file-schemes
        title: "Relative includes can retrieve non-filesystem resources"
        concern: significant
        locations:
          - path: crates/yamalgam-resolve/src/session.rs
            start_line: 1277
            end_line: 1292
        evidence: |
              if capability == ResolutionCapability::Include
                  && matches!(reference.resource.scheme(), "http" | "https")
              {
                  return Err(self.error(
                      ResolutionErrorCategory::PolicyDenied,
                      capability,
                      span,
                      target_name(reference),
                      Some(Box::new(RetrieveError::PolicyDenied {
                          id: reference.resource.clone(),
                      })),
                  ));
              }
              if capability != ResolutionCapability::Ref || reference.resource == *parent {
                  return Ok(());
              }
        evidence_lang: rust
        evidence_markers:
          - lines: "1-2"
            type: del
            label: "Only HTTP schemes are denied"
          - lines: "14-16"
            type: del
            label: "Every other include scheme bypasses reference policy"
        mechanism: |
          The M11 specification requires includes to address filesystem resources,
          but policy enforcement rejects only HTTP and HTTPS. A relative include
          under a memory or custom-scheme document inherits that scheme, returns
          through the early-success branch, and is dispatched to the registered
          backend without the reference scheme allowlist.
        remediation: |
          Require every resolved include target and discovery base to use the file
          scheme, returning PolicyDenied otherwise. Replace memory-backed include
          integration fixtures with filesystem fixtures or explicit rejection tests.
        effort: small
        effort_notes: "One centralized policy check plus focused retriever and consumer tests."

      - slug: explicit-only-sessions-skip-root-anchor-reservation
        title: "Explicit-only sessions do not reserve anchors from the complete root"
        concern: significant
        locations:
          - path: crates/yamalgam-resolve/src/session.rs
            start_line: 99
            end_line: 120
        evidence: |
          /// Seed the raw-document cache with the containing root document.
          pub fn prime_root(&mut self, id: ResourceId, document: OwnedDocument) {
              if self.cache.insert(id.clone(), Arc::new(document)).is_none() {
                  self.report.record_resource(ResourceRecord {
                      kind: resource_kind(&id),
                      id,
                      fetched_bytes: 0,
                      cache_hits: 0,
                      provenance: ResourceProvenance::default(),
                  });
              }
          }

          /// Resolve automatic directives in one root document.
          ///
          /// # Errors
          ///
          /// Returns a structured [`ResolveError`] on the first failed directive.
          pub fn resolve_root(&mut self, document: OwnedDocument) -> Result<OwnedDocument, ResolveError> {
              anchors::reserve(&document.root, &mut self.reserved_anchors);
              let origin = document.root.origin.clone();
              self.prime_root(origin, document.clone());
        evidence_lang: rust
        evidence_markers:
          - lines: "2-12"
            type: del
            label: "Priming does not reserve root anchors"
          - lines: "20"
            type: mark
            label: "Reservation occurs only on the automatic path"
        mechanism: |
          Query sessions with both capabilities in explicit mode prime the root
          without calling resolve_root. Later resolve_explicit reserves only the
          selected value, so imported anchor namespaces are chosen without anchors
          elsewhere in the output root. A generated imported name can collide with
          a sibling root anchor and rebind a later alias.
        remediation: |
          Reserve document.root inside prime_root before caching it, and remove the
          duplicate reservation from resolve_root. Add an explicit-only subtree
          resolution test whose root sibling already uses the predicted generated
          anchor name and whose later alias must retain its original binding.
        effort: small
        effort_notes: "Move the existing reservation into the shared root-seeding path."

      - slug: builtin-resolver-mixes-caller-and-session-configs
        title: "BuiltinResolver enforces two different loader configurations"
        concern: significant
        locations:
          - path: crates/yamalgam-resolve/src/builtin.rs
            start_line: 58
            end_line: 90
          - path: crates/yamalgam-resolve/src/builtin.rs
            start_line: 28
            end_line: 33
        evidence: |
          fn process<'input>(
              &mut self,
              event: Event<'input>,
              config: &LoaderConfig,
          ) -> Result<ResolvedEventBuf<'input>, ResolveError> {
              if !automatically_resolves(config) {
                  return Ok(yamalgam_parser::resolve::smallvec![event]);
              }
              if matches!(self.state, ResolverState::Failed) {
                  return Ok(ResolvedEventBuf::new());
              }
              if matches!(event, Event::StreamStart | Event::StreamEnd) {
                  return Ok(yamalgam_parser::resolve::smallvec![event]);
              }

              let is_document_end = matches!(event, Event::DocumentEnd { .. });
              let owned = event.into_owned();
              match &mut self.state {
                  ResolverState::Idle => self.state = ResolverState::Buffering(vec![owned]),
                  ResolverState::Buffering(events) => events.push(owned),
                  ResolverState::Failed => unreachable!("failed state returned above"),
              }
              if !is_document_end {
                  return Ok(ResolvedEventBuf::new());
              }

              let ResolverState::Buffering(events) = mem::replace(&mut self.state, ResolverState::Idle)
              else {
                  unreachable!("document end always has a buffer")
              };
              let result = OwnedDocument::from_events(self.root.clone(), events.iter().cloned())
                  .map_err(document_error)
                  .and_then(|document| self.session.resolve_root(document));
        evidence_lang: rust
        evidence_markers:
          - lines: "4-7"
            type: del
            label: "Caller configuration selects whether resolution runs"
          - lines: "31-33"
            type: del
            label: "Session configuration performs policy enforcement"
        mechanism: |
          on_event_with_config supplies the downstream consumer's LoaderConfig to
          process, but the retained ResolutionSession owns the independently supplied
          constructor configuration. The caller configuration gates buffering while
          the session configuration controls modes, schemes, hosts, roots, parsing,
          and limits. Mismatched public inputs can bypass the caller's stricter policy
          or silently leave requested directives unresolved.
        remediation: |
          Make one configuration authoritative. Minimally reject any
          on_event_with_config configuration unequal to session.config before
          buffering; preferably bind the consumer and built-in resolver to one shared
          configuration so the API cannot represent a mismatch. Test differing modes,
          roots, hosts, and limits.
        effort: medium
        effort_notes: "The comparison is small; choosing and documenting configuration ownership is the larger part."

  - slug: session-budgets-and-discovery
    title: "The Session Budgets and Discovery Surface"
    thesis: "Edge and materialization limits are enforced, but retained cache memory and filesystem traversal work can grow beyond those counters."
    verdict: "The descriptor-centered filesystem implementation closes the race and determinism findings from the first audit. It still needs budgets for unique fetched bytes and visited directory entries, plus unique-resource accounting before the match ceiling, so attacker-controlled but authorized trees cannot turn bounded output into unbounded work."
