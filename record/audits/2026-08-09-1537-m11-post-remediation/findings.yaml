---
audit_date: 2026-08-09
scope: "M11 external-resolution changes from c85f7e0 through 246f707"
commit: 246f707890c9bc42bd41b5af128905be104bf354
assessment: |
  The remediation closes every item from the first M11 review and leaves the
  architecture intact, but the fresh pass found eleven remaining boundary gaps.
  Policy ownership is still ambiguous in the built-in adapter, explicit-only
  sessions miss part of the anchor namespace, and relative includes can inherit
  non-file schemes. Session memory and discovery work are not fully budgeted.
  Query conversion and session annotation retain recursive paths, while several
  error paths still lose reports or retain caught errors for the life of a run.
  The implementation is close, but these are shipping blockers for adversarial
  or very large inputs rather than polish items.

narratives:
  - slug: resolution-policy-and-graph-integrity
    title: "The Resolution Policy and Graph Integrity Surface"
    thesis: "The central resolver is disciplined, but three public entry paths do not share one authoritative policy and anchor boundary."
    verdict: "The URI, filesystem, and imported-anchor remediations are sound on their primary paths. The remaining gaps are entry-point inconsistencies: include scheme enforcement is narrower than the documented contract, explicit sessions seed roots differently from automatic sessions, and the built-in adapter can mix two policies."
