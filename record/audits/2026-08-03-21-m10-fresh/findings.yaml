        evidence_markers:
          - lines: "6"
            type: mark
            label: "a full second traversal of the value tree before any bytes are written"
          - lines: "7"
            type: mark
            label: "HashSet<String>; each anchor is copied at line 93 though Rc<str> is available"
        mechanism: |
          to_yaml (yaml.rs:18) and to_json (json.rs:11) both open with validate_value, which
          walks the entire value tree to enforce depth, scalar-size, collection-size and
          alias-expansion limits before the emitter walks it again to produce output. That
