      - slug: emit-validation-walks-the-tree-a-second-time
        title: "Every emitted value is traversed twice, and each anchor name is copied into a String"
        criterion: "12.5"
        surface: "Performance"
        concern: advisory
        locations:
          - path: crates/yamalgam-query/src/emit/mod.rs
            start_line: 66
            end_line: 73
        evidence: |
          fn validate_value(
              value: &YamlVal,
              options: &EmitOpts,
              format: EmitFormat,
