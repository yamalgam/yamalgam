            type: mark
            label: "Flag does not exist; `yg --allow-includes` is a clap usage error"
          - lines: "4-5"
            type: mark
            label: "Same — deferred to M11 by deviation #10"
        mechanism: |
          Three spec surfaces are absent from the shipped binary, all three matching the plan's
          declared deviations exactly, and all three recorded in
          docs/spec/yg-spec-draft-01-implementation-notes.md (sections 2, 4, 10):
            - r[ext.chomping] (spec line 353) — no `chomping` native in funs.rs; deferred to the
