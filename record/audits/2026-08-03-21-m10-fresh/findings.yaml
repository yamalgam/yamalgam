---
audit_date: 2026-08-03
scope: "M10 milestone surface — 24 commits on branch m10-yg-cli vs main (merge-base 6e3a646): the new yamalgam-query crate, the yg CLI, and M10's yamalgam-core tag-resolution additions"
commit: b96a66abf1495c84d2c23ced276678bd25527167
assessment: |
  M10 is the largest single expansion in this workspace's history and the one that
  most changes its nature. Until this branch, yamalgam only ever read bytes and
  produced events. M10 introduces three new trust boundaries simultaneously: a
  third-party interpreter (jaq) that executes user-supplied filter programs, the
  first file-write path (atomic in-place editing), and the first YAML emitter —
  which means yamalgam now produces YAML that something else will parse.

  The engineering is disciplined. There is no unsafe code, no threading, and no FFI
  in the new surface. clippy passes with nursery lints enabled, cargo-udeps is clean,
  and cargo-deny reports no advisory, ban, license, or source violations under the
  project's own config. The error architecture uses thiserror throughout, the value
  model is deliberate about metadata preservation, and the jq-manual fixture suite is
  a genuinely strong completeness harness — the kind of test asset most projects
  never build. Against the spec, M10 substantially delivers: the deviations found are
  overwhelmingly the ones the implementation plan already documented for Clay's veto.

  The findings concentrate in three places. First, resource bounds: the runtime limits
  exist but are enforced at three call sites rather than structurally, so a filter can
  construct depth and size at runtime that the parse-time gate never sees. Two agents
  reached this conclusion independently from different rubrics, and it re-opens the
  Billion Laughs concern one layer above where it was solved. Second, the emitter:
  node tags are replayed into output nearly verbatim, which turns preserved metadata
  from a fidelity feature into a structure-injection primitive. Third, allocation
  behavior: the event-to-value builder duplicates every scalar to retain raw text,
  which is a defensible design choice that has never been stated as one.

  Nothing here is a critical finding, and nothing blocks the milestone. The three
  significant items are all fixable without architectural change, and the bulk of what
  remains is dominated by choices that are defensible but currently undocumented. The
  gap between this audit and the one that ran at hour 18 is mostly the interpreter
  surface, which did not exist in reviewable form then.

  Every finding below was verified against the source by a second agent that did not
  write it. That pass confirmed 35 findings, corrected 14, and killed 1 — a proposed
  optimization that would have silently weakened the alias-expansion limit on the
  --sort-keys path. Two further findings were merged as cross-narrative duplicates.
  The corrections were overwhelmingly of one kind: a real defect paired with an
  over-attributed cause or an over-promised fix. Where a remediation is stated here,
  it has been checked to be implementable and to actually address the mechanism.

