          The engine this function delegates to, `engine::run_filter_with_null_input`, already
          takes its input iterator as `impl Iterator<..> + 'a` with a free lifetime parameter — it
          boxes the iterator into a `Box<dyn Iterator + 'a>` and never needs `'static`. Requiring
