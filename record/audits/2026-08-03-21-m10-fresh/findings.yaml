            type: mark
            label: "allocates unconditionally; only the sort_keys branch needs an owned Vec"
        mechanism: |
          The same shape appears three times — this Context::entries in the YAML emitter, the
          JSON emitter's mapping arm (emit/json.rs:48-52), and validate_value's mapping arm
          (emit/mod.rs:114-117) — and in all three the Vec<(&K, &V)> is materialized before
          the sort_keys flag is consulted. sort_keys defaults to false, so the common path
          pays one heap allocation of 16*n bytes per mapping per emit for a collection it then
          iterates in IndexMap order, which it could have done by borrowing. Because
          validate_value is a separate pass, a document with m mappings pays 2m of these
          allocations per emitted value for both YAML and JSON — validate_value at
          emit/mod.rs:114 plus the emitter's own collect — and the JSON path additionally
          allocates a per-mapping `HashSet::with_capacity(entries.len())` at json.rs:54, which
          is a distinct allocation rather than a third Vec. Small in absolute terms next to the
          other emit costs, but it is the textbook "collection allocated inside the loop body"
          pattern and the fix is mechanical.
        remediation: |
          Branch before allocating: on the sort_keys path collect and sort as today; on the
          default path iterate mapping.0.iter() directly. Either return an either-style
          iterator, or restructure each call site into a for_each_entry(&self, mapping, f)
          helper that picks the iterator internally. A per-Context reusable Vec that is
          cleared and refilled would also serve the sorting path.
