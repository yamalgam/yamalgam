  - slug: value-model-and-api
    title: "The Value Model and API Surface"
    thesis: "The YamlVal model carries its metadata cleanly, but the crate exposes more of its internals than it needs to and duplicates jaq's own vocabulary in places where the two definitions can drift apart."
    verdict: "yamalgam-query is publish = false, which lowers the stakes on every finding here — none of this is a compatibility commitment yet. That is precisely why it is worth fixing now. The item to take seriously is the inherent as_bool shadowing jaq's truthiness rule: two definitions of truth in one crate is a correctness trap waiting for the first caller who picks the wrong one. The rest is API hygiene that costs nothing today and costs a breaking change after the first publish."
    flow:
      - id: yamlval
        label: "YamlVal { data, meta }"
        type: start
        findings:
          - slug: internal-value-representation-is-public
            label: "Internals public"
      - id: core-valt
        label: "impl jaq_core::ValT"
        type: process
      - id: truthy
        label: "Which truthiness?"
        type: decision
        no: inherent-bool
      - id: std-valt
        label: "impl jaq_std::ValT"
        type: process
      - id: interpret
        label: "jaq interprets"
        type: process
        findings:
          - slug: run-records-static-bound-forces-clones
            label: "'static forces clone"
      - id: result
        label: "Result values"
        type: end
      - id: inherent-bool
        label: "Inherent as_bool"
        type: process
        spine: false
        findings:
          - slug: as-bool-inherent-shadows-jaq-truthiness
            label: "Shadowed rule"
        next: interpret

    findings:
      - slug: as-bool-inherent-shadows-jaq-truthiness
        title: "Inherent `as_bool` shadows `jaq_core::ValT::as_bool` with incompatible semantics"
        criterion: "9.2"
        surface: "Trait Design"
        concern: moderate
        locations:
          - path: crates/yamalgam-query/src/value.rs
            start_line: 211
            end_line: 218
        evidence: |2
              /// Return the resolved boolean value.
              #[must_use]
              pub const fn as_bool(&self) -> Option<bool> {
                  match self.data {
                      Data::Bool(value) => Some(value),
                      _ => None,
                  }
              }
        evidence_lang: rust
        evidence_markers:
          - lines: "3"
            type: mark
            label: "inherent as_bool returns Option<bool>; trait as_bool returns jq truthiness"
        mechanism: |
          `YamlVal` carries two public `as_bool` methods with different meanings. The inherent
          one above answers "is this a YAML boolean, and which one" (`Option<bool>`). The trait
          impl at crates/yamalgam-query/src/valt.rs:346 answers jq's truthiness question —
          `!matches!(&self.data, Data::Null | Data::Bool(false))` — so integer `0`, the empty
          string, and the empty sequence are all `true`. Inherent methods win method-call
          resolution unconditionally, so `value.as_bool()` always selects the `Option` variant
          even when `jaq_core::ValT` is in scope. The crate's own code already pays for this:
          crates/yamalgam-query/src/engine.rs:267 and the tests at
          crates/yamalgam-query/src/valt.rs:614-616 must spell it `jaq_core::ValT::as_bool(&v)`
          to reach the truthiness semantics. A downstream caller writing the natural
          `value.as_bool().unwrap_or(false)` compiles and silently gets non-jq semantics.
          The same collision exists for `as_f64` (inherent at value.rs:231, `jaq_std::ValT` at
          valt.rs:449) with two copies of identical logic that can drift.
        remediation: |
          Rename the inherent accessors so nothing shadows a trait method the crate also
          implements — `as_yaml_bool` / `as_boolean`, and have the `jaq_std::ValT::as_f64` impl
          delegate to the single inherent implementation rather than duplicating the match. If
          the current names must stay, document the shadowing on both items and add a doc test
          showing the UFCS form needed for truthiness.
        temporal:
          introduced: "2026-08-02"
          last_modified: "2026-08-03"
          commit_count: 3
        chains:
          enables: []
          enabled_by: []
          related: [internal-value-representation-is-public]
        effort: small
        effort_notes: "Rename plus call-site updates inside one crate; no external consumers yet"

