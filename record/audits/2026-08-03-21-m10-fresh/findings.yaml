            label: "holds only because every caller pre-checks is_block_collection"
        mechanism: |
          Four unreachable!() sites appear outside #[cfg(test)]: emit/yaml.rs:78,
          emit/yaml.rs:237, emit/yaml.rs:252, and build.rs:254. Each was traced and
          none is currently reachable from external input. block_collection is only
          ever called after is_block_collection() has confirmed a non-empty Seq or Map
          (node at yaml.rs:57, sequence at yaml.rs:84, mapping_entry at yaml.rs:131);
          the flow-scalar case at yaml.rs:237 passes Position::Flow, which forces
          block_allowed false in string() (yaml.rs:259) so Rendered::Literal cannot be
