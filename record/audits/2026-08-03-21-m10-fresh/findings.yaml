        evidence_lang: rust
        evidence_markers:
          - lines: "4"
            type: mark
            label: "returns all documents at once rather than an iterator"
          - lines: "13"
            type: mark
            label: "every document in the file stays live until the last one is parsed"
        mechanism: |
          The CLI does defer work file by file — deferred_inputs (query.rs:366-433) pulls one
          path at a time, so a 100-file invocation does not load 100 files at once. Within a
          file, though, the pipeline is fully eager: collect_inputs reads the entire file into
          a String (query.rs:473) and parse_str_with_config parses every document in it into a
