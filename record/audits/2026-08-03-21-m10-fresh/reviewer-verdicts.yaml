  - slug: deny-advisory-ignore-matches-only-under-all-features
    verdict: CONFIRMED
    notes: |
      Reproduced both invocations exactly as instructed, and the finding's
      claim is precisely right.

      `cargo deny --config .config/deny.toml check advisories`:
        warning[advisory-not-detected]: advisory was not encountered
           ┌─ .config/deny.toml:57:6
        57 │     "RUSTSEC-2023-0051",
           │      ━━━━━━━━━━━━━━━━━ no crate matched advisory criteria
        advisories ok   (exit 0)

      `cargo deny --all-features --config .config/deny.toml check advisories`:
        advisories ok   (exit 0), no warning at all.

      That is exactly the asymmetry the finding describes, down to the cited
      line 57. So the audit context's claim that the corrected invocation still
      reports the unmatched entry does NOT hold, and the finding is right to
      say so.

      Evidence exact at .config/deny.toml:53-58, six lines, verbatim including
      both comment lines. Marker line 5 lands on `"RUSTSEC-2023-0051",` (source
      57), matching cargo-deny's own diagnostic pointer.

      The feature-graph explanation is the correct mechanism (cargo-audit reads
      Cargo.lock and is feature-agnostic; cargo-deny walks resolved metadata
      where the optional yamlstar peer is off). The scope note — deny.toml
      predates M10 and is reported only because it was asked for — is honest
      and correctly placed. `note` is proportionate: there is no security gap,
      only a policy file whose correctness depends on an unwritten flag.
      Remediation is sound and trivially applied in the justfile and CI.
