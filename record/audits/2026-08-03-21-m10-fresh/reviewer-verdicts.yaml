  - slug: ygmap-drop-allocates-a-vec-per-mapping
    verdict: ADJUSTED
    notes: |
      Evidence matches crates/yamalgam-query/src/value.rs:117-125 exactly (including the
      blank line at 123). Markers point at the right lines: relative 4 = value.rs:120
      (flat_map), relative 9 = value.rs:125 (the collect).

      The finding's outcome is real: every YgMap drop heap-allocates a fresh 2n-element Vec,
      including two-entry temporaries, with no small-size fast path.

      CORRECTION to the mechanism and to the marker label. The blame placed on `flat_map`
      ("flat_map defeats the Vec::from_iter allocation-reuse specialization") is wrong. The
      specialization only applies to `vec::IntoIter<T>` collected back into `Vec<T>`;
      YgMap's source is `IndexMap::into_iter()`, which is `indexmap::map::IntoIter` yielding
      `(YamlVal, YamlVal)` pairs — a different iterator type with a different item type from
      the `YamlVal` being collected. Removing the flat_map would not enable reuse; the
      allocation is unavoidable at that call site regardless. The contrast drawn with YgSeq
      is correct (value.rs:113 passes a real `Vec<YamlVal>`, so `vec::IntoIter` reuse does
      apply there) — but the reason YgMap differs is the IndexMap source, not the adapter.

      Consequence for the remediation: the third option offered ("restructure so the initial
      collect receives a vec::IntoIter (build a Vec::with_capacity(2n) from a drain)") does
      not save anything — building that Vec *is* the allocation. Drop it. The first option
      (shallow fast path when no entry's data is Seq/Map) is sound: the taken IndexMap then
      drops normally, and any nested Rc<YgSeq>/Rc<YgMap> would still hit their own iterative
      Drop impls, so the stack-overflow property is preserved. The thread-local reusable
      buffer is also sound.

      Concern `advisory` remains appropriate.

