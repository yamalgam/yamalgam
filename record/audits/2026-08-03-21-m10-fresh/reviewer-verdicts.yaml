verdicts:
# Reviewer verdicts for narratives `emitter-and-expansion` and `error-and-panic`
# Audited at commit b96a66abf1495c84d2c23ced276678bd25527167 (working tree clean
# except this untracked audit directory). Evidence blocks were compared line for
# line against the cited files; causal claims were reproduced with the existing
# release binary at target/release/yg (yg 0.1.0, built from this commit).

verdicts:
  - slug: emitter-replays-tags-verbatim
    verdict: CONFIRMED
    notes: |
      Evidence exact: emit/yaml.rs:422-430 is `safe_tag` verbatim, 9 lines, no
      drift. Markers correct — evidence lines 5-6 are the `strip_prefix('!')` /
      `then(|| tag.to_owned())` pair, lines 2-3 are the `!!` / `!<` passthrough.
      Second location emit/yaml.rs:360-366 is the `properties()` tag arm; third
      location value.rs:379-398 is `set_tag`, and value.rs:401-433 `set_anchor`
      does enforce `[A-Za-z0-9_-]+` exactly as claimed.

      Traced the sink and found no neutralizing step. `tag_shorthand`
      (value.rs:305-314) only rewrites `tag:yaml.org,2002:` prefixes; `paint`
      (yaml.rs:413-419) is an identity function when color is off; `node`'s
      `prefix.trim_end()` (yaml.rs:68) strips only trailing whitespace, so an
      embedded newline survives. `validate_value` (emit/mod.rs:66-128) never
      inspects `Meta.tag`. Nothing else touches the tag between build and output.

      Source side confirmed: scanner.rs:1643-1651 accepts any non-whitespace,
      non-flow-indicator run after `!`; `decode_tag_uri` (scanner.rs:2861-2878)
      percent-decodes with no re-validation, and the decoded string is stored
      straight into the token at scanner.rs:1696-1704. The QLJ7 handle check at
      scanner.rs:1679-1691 does not fire because there is no second `!`.

      Reproduced end to end. Input `k: !x%0Ainjected%3A%20true v`:
        $ yg . evil.yaml
        k: !x
        injected: true v
        $ yg . evil.yaml | yg 'keys'
        - k
        - injected
      A new top-level key appears in the re-parse. `yg -i . inplace.yaml` writes
      that same content into the user's file (exit 0). The filter source is real
      too: `yg -n '{} | set_tag("x: 1")'` emits `!<x: 1> {}`, and
      `set_tag("x\ninjected: true")` emits a verbatim tag containing a raw
      newline. Remediation (percent-re-encode outside ns-tag-char in `safe_tag`,
      mirror `set_anchor`'s validation in `set_tag`) closes both sources and is
      the exact inverse of `decode_tag_uri`. `significant` is proportionate for a
      local CLI: the realistic path is `yg -i` over an untrusted YAML file.

      One nitpick, not affecting the verdict: the mechanism cites parser.rs:540
      for "the parser hands through unchanged"; the assignment `tag =
      Some(t.atom.data);` is parser.rs:539 (540 is the closing brace).

  - slug: explode-aliases-unbounded-expansion
    verdict: CONFIRMED
    notes: |
      Evidence exact: value.rs:503-526, 24 lines including `#[must_use]` and the
      `// r[impl ext.explode]` annotation, uniformly de-indented but otherwise
      byte-identical. Markers correct — evidence line 3 is the signature (no
      limits parameter), lines 5-14 are the two recursing collection arms.

      No budget is applied anywhere on the path. `explode_aliases` takes no
      config and calls nothing; its sole caller is funs.rs:187-189
      (`bome(Ok(context_value.1.explode_aliases()))`), which does not consult
      `context_value.0.data().context.config.limits` even though the neighbouring
      `filename` native (funs.rs:182-185) proves that handle is reachable. The
      three `runtime_limits::check_*` call sites in the whole crate are
      valt.rs:202, valt.rs:266, ops.rs:130 — grep-confirmed, none on this path.
      The contrast the mechanism draws is accurate: build.rs:154-159 counts alias
      events, build.rs Alias arm shares data by Rc (only `meta_mut` clones), and
      emit/mod.rs:82-91 re-counts alias expansions before rendering.

      Reproduced. A 7-level, 7-way bomb (8 lines, ~300 bytes, 43 alias events vs
      --strict's cap of 100):
        $ yg --strict '.top | length' bomb.yaml        -> 7,  9 MB RSS, 0.00s
        $ yg --strict '.top | explode_aliases | flatten | length' bomb.yaml
          -> 823543, 169 MB RSS, 2.22s
      --strict does not bound it. Two more levels (9x9) is ~10^8 nodes, matching
      the finding's arithmetic (9^9 = 387,420,489). Limit values verified in
      loader.rs: strict max_alias_expansions = 100, moderate = 10_000.

      Secondary claim also holds: `Display for YamlVal` (value.rs:793-828) walks
      the expanded tree unbounded, and `merge_keys` formats through it via
      `Error::typ(self.clone(), "mapping")` at value.rs:463.

      Remediation is implementable: `explode_aliases` is `pub(crate)`, its one
      call site wraps the result in `bome(...)`, so returning `ValR<Self>` is a
      local change.

  - slug: emitter-omits-c1-control-escapes
    verdict: ADJUSTED
    notes: |
      Evidence exact: value.rs:865-887, 23 lines, byte-identical. Markers correct
      (line 14 = the `< 0x20` arm, line 18 = the `other => output.push(other)`
      fallthrough). The core defect is real and reproduced:
        $ printf 'a: "x\\u0085y"\n' | yg . | od -c
          a : " x 302 205 y " \n            # raw U+0085 inside the quoted scalar
        $ printf 'a: "x\\u007fy"\n' | yg . | od -c
          a : " x 177 y " \n                # raw DEL
        $ printf 'x\302\205y\n' | yg -R -s . | od -c
          " x 302 205 y \ n " \n            # -R -s path confirmed
      `needs_quotes`'s `char::is_control` (value.rs:847) does cover U+007F-U+009F
      as claimed, and the c-printable analysis (excludes U+007F-U+0084 and
      U+0086-U+009F) is correct.

      CORRECTION — one causal claim does not hold. The mechanism says yg emits a
      document "that a conforming parser must reject: its own scanner included"
      and that "`yg . in.yaml | yg .` can therefore fail on a value yg itself
      produced". yamalgam's scanner does not enforce c-printable: input.rs:124
      states outright "printable chars enforced by UTF-8 validation", and the
      scanner treats only `\n` and `\r` as line breaks (every break site matches
      `Some('\n' | '\r')`; U+0085 is produced only by the `\N` escape at
      scanner.rs:2304). Verified:
        $ yg . c1.yaml | yg '.a | length'  ->  3, exit 0
      The round trip through yg succeeds and preserves the value. Replace that
      sentence with the interop framing the finding already makes for U+0085:
      the emitted document violates YAML 1.2 `c-printable` and libyaml/PyYAML
      (and any YAML 1.1 reader, which treats NEL as a break) will reject it or
      silently re-fold the scalar. Suggested replacement for the second
      paragraph's last two sentences: "yg emits a document that a conforming
      parser must reject. yamalgam's own scanner is permissive here — it defers
      printability to UTF-8 validation (input.rs:124) and treats only LF/CR as
      breaks — so `yg . | yg .` round-trips, but libyaml, PyYAML and every YAML
      1.1 reader treat U+0085 as a line break, so the emitted scalar re-parses
      elsewhere as a folded two-line scalar with different content."

      Remediation is otherwise sound (`\L` = U+2028 and `\P` = U+2029 are indeed
      valid YAML double-quoted escapes; `\x85` is valid for NEL). Worth noting it
      is incomplete for LS/PS: `char::is_control` is false for U+2028/U+2029, so
      those are emitted as *plain* scalars and never reach `quote_double` — the
      "invert the test" form needs to apply to `needs_quotes` as well.

      `moderate` remains proportionate: this is an output-conformance and interop
      defect, not a local corruption path.

  - slug: emitter-plain-document-end-marker
    verdict: ADJUSTED
    notes: |
      Evidence exact: value.rs:832-849, 18 lines, byte-identical. Markers correct
      (line 9 = the indicator set without `.`, lines 10-17 = the disjunction with
      no marker check). The defect is real and reproduced:
        $ printf 'a: ...\n' > dots2.yaml; yg '.a' dots2.yaml > out3.yaml
        $ od -c out3.yaml   ->   .  .  .  \n
        $ yg . out3.yaml    ->   (no output, exit 0)
      The string is destroyed on re-read exactly as described. Multi-document
      output confirmed too: `yg -n '"...", "x"'` emits a bare `...` followed by
      `---` and `x`.

      CORRECTION — the reproduction command in the mechanism is wrong. It says
      "`yg '.a' evil.yaml > clean.yaml` where `a: '...'`". A single-quoted input
      scalar carries `NodeStyle::Scalar(SingleQuoted)` in its metadata, and
      `string()` (emit/yaml.rs:284-292) re-applies that style, so the output is
      `'...'` — quoted and safe. Verified:
        $ printf "a: '...'\n" | yg '.a'   ->   '...'
        $ printf 'a: "..."\n' | yg '.a'   ->   "..."
      The finding reproduces only when the scalar reaches the emitter with plain
      or absent style: a plain input scalar (`a: ...`) or a filter-constructed
      string (`yg -n '"..."'` also writes a bare `...`). Change the example to
      `a: ...` (plain) and the rest of the paragraph stands unchanged.

      The incidental-`---` observation is correct (`-` is in the indicator set, so
      `---` is quoted today). Remediation is sound and would take effect:
      `string()` tests `needs_quotes` *before* consulting the preserved style
      (emit/yaml.rs:274-282), so a `...` clause in `needs_quotes` wins over style
      preservation. `moderate` is proportionate — silent content destruction on
      round-trip, including under `-i`.

  - slug: runtime-limits-cover-three-call-sites
    verdict: ADJUSTED
    notes: |
      Evidence exact: value.rs:685-690, 6 lines, byte-identical; marker line 4 is
      the `Self::seq(iter.into_iter().collect())` body. Second location
      runtime_limits.rs:19-25 is the two check helpers. The "exactly three call
      sites" claim is grep-verified: valt.rs:202, valt.rs:266, ops.rs:130 and
      nothing else in the workspace. The jaq citation is right against the
      actual dependency (jaq-core 3.1.0, not just the ref/jaq clone):
      `Ast::Arr(f) => box_once(f.run(cv).collect())` is filter.rs:473, and that
      collect lands in this `FromIterator` impl. `activate` at engine.rs:227 ✓.
      `advisory` is well argued and proportionate.

      CORRECTION — the "enforce" half of the remediation is not implementable as
      written. `FromIterator::from_iter` returns `Self`, and `YamlVal::seq`
      (value.rs:182) and `YamlVal::map` (value.rs:191) also return `Self`, so a
      `check_collection_size` there has no error channel: it could only panic,
      truncate, or set a deferred flag. Of the three named sites only
      `ValT::from_map` (valt.rs:33 -> `ValR<Self>`) can propagate. Rewrite the
      enforce option as: enforce in `ValT::from_map`, and for the `Self`-returning
      constructors either record a tripped-limit flag in a thread-local beside
      `runtime_limits::ACTIVE` and convert it to a `YgError::Runtime` after each
      output (the same shape this audit proposes for `into_string`), or accept
      that array construction is unbounded and take the documentation option.
      The documentation option is unaffected and remains sound.

  - slug: env-access-always-compiled-in
    verdict: CONFIRMED
    notes: |
      Evidence exact: engine.rs:36-40, 5 lines, byte-identical; marker line 3 is
      `Self { allow_env: true }`. `compile_filter` at engine.rs:161-163 does pass
      `CompileOptions::default()`, and commands/query.rs:49 is the CLI's only
      compile entry point. `env` filtering happens at funs.rs:14
      (`allow_env || *name != "env"`). Grep for `sandboxed()` across the workspace
      returns exactly two hits: the definition at engine.rs:31 and
      tests/engine.rs:120 — the cited test body is tests/engine.rs:118-122,
      accurate. No CLI flag exists.

      Reproduced: `SECRET_TOKEN=abc123 yg -n 'env.SECRET_TOKEN'` prints `abc123`.

      The module-loading counter-observation is correct and verified against the
      real dependency, not just the ref/jaq clone: jaq-core 3.1.0
      src/load/mod.rs:194 is `read: |_path| Err("module loading not supported"
      .into())`, and `compile_filter` never calls `with_read`/`with_std_read`.

      `advisory` is proportionate — this is jq parity, and the finding says so.

  - slug: value-tree-recursion-has-no-depth-bound
    verdict: CONFIRMED
    notes: |
      Evidence exact: value.rs:505-526, 22 lines, byte-identical; marker 2-13
      covers the recursing match. Every cited traversal is where it is claimed:
      `explode_aliases` value.rs:505, `PartialEq::eq` 698, `Ord::cmp` 742,
      `Hash::hash` 759, `Display::fmt` 793, `deep_merge` ops.rs:29 (self-recursive
      at ops.rs:39). The Drop counterexample is real: YgSeq/YgMap Drop impls at
      value.rs:111-122 hand off to the `drop_values` worklist at value.rs:124.
      The emit counterexample is real: `validate_value` (emit/mod.rs:66-128) is an
      explicit stack and calls `check_depth` per node.

      Both reachability arguments hold. From input: `check_depth(depth)` at
      build.rs:93-96 counts event nesting, and the `Event::Alias` arm
      (build.rs:154-171) clones the anchored value without incrementing depth, so
      an anchor chain yields value depth N from syntactic depth 2. Limit values
      verified in loader.rs: moderate max_anchor_count/max_alias_expansions =
      10_000 each; trusted max_anchor_count = None with max_alias_expansions =
      1_000_000 — exactly as stated. Mapping keys are hashed at build.rs:144.

      Reproduced the abort:
        $ yg -n '[(reduce range(200000) as $i (null; [.])), (...)] | sort | length'
        thread 'main' has overflowed its stack
        fatal runtime error: stack overflow, aborting
        exit=134
      SIGABRT, not a catchable panic, as claimed. `moderate` is proportionate.

  - slug: input-error-class-flattened-through-string
    verdict: CONFIRMED
    notes: |
      Evidence exact: engine.rs:226-230, 5 lines, byte-identical; marker line 3 is
      the `error.into().to_string()` map. Reconstruction at engine.rs:246 is
      quoted correctly, character for character. The doc comment at error.rs:28
      and the blanket impl at error.rs:81-85 are where the finding says.
      `validate_input_paths` (commands/query.rs:435-441) does use `fs::metadata`;
      the later failure is `read_to_string` at commands/query.rs:473-475
      producing `YgError::InputRead`, which `deferred_inputs` carries as a record
      error (commands/query.rs:422-429) into the stringifying stream.

      Reproduced exactly:
        $ chmod 000 perm.yaml; yg . perm.yaml
        yg: failed to read perm.yaml: Permission denied (os error 13)
        exit=5                      # contract says 2
        $ yg . nope.yaml
        yg: failed to read nope.yaml: No such file or directory (os error 2)
        exit=2                      # caught by the pre-check, class preserved
      The exit-2/exit-5 split is precisely as described.

      Remediation is sound and idiomatic here — `RunCtx` already carries
      `pending_input_meta`/`input_meta` RefCells staged by the same iterator, so a
      parallel error stash fits the existing pattern. Minor: the "deleting
      `impl From<String> for YgError`" suggestion would not force a fix at
      engine.rs:246, which already names `InputParse` explicitly; it is a
      defense-in-depth cleanup, not the mechanism of this bug. Worth softening if
      the wording is revisited, but the finding is accurate as written.

  - slug: growth-operators-bypass-runtime-limits
    verdict: CONFIRMED
    notes: |
      Evidence exact: ops.rs:57-69, 13 lines, byte-identical; markers correct
      (line 9 = the `Str + Str` concat, lines 10-13 = the `Seq + Seq` extend).
      Guard scoping described correctly: `activate` at engine.rs:227,
      `Guard::drop` restores at runtime_limits.rs:27-33, and the three consulting
      sites are grep-confirmed as ops.rs:130 plus valt.rs:202/266. Limit values
      verified: strict max_scalar_bytes = 1 MB, max_collection_size = 100_000;
      trusted has both as None; moderate caps both.

      Reproduced the asymmetry under --strict:
        $ yg --strict -n '("x" * 2097152) | length'
        yg: <stdin> document 1: scalar size 2097152 exceeds maximum of 1048576  (exit 5)
        $ yg --strict -n 'reduce range(21) as $i ("x"; . + .) | length'
        2097152   (exit 0)
        $ yg --strict -n 'reduce range(20) as $i ([0]; . + .) | length'
        1048576   (exit 0)
      `*` is guarded, `+` is not, at the same magnitudes.

      Primary remediation is sound: `Add::add` returns `Result`, so both checks
      propagate cleanly at ops.rs:65 and ops.rs:67. Two notes for the sweep:
      `Map + Map` (ops.rs:70-78) is unchecked as well and is not named; and of the
      three sweep targets, `from_map` (valt.rs:33) and `map_values` (valt.rs:142)
      can propagate but `YamlVal::seq` via `FromIterator` (value.rs:685-690)
      cannot — it returns `Self` — so that one needs the deferred-flag treatment
      rather than a check call. `moderate` is proportionate.

  - slug: into-string-substitutes-error-text-as-data
    verdict: ADJUSTED
    notes: |
      Evidence exact: valt.rs:350-356, 7 lines, byte-identical; marker line 5 is
      the `map_or_else` fallback. The core defect is real and reproduced:
        $ printf '{1: "x", "1": "y"}\n' | yg '. | tostring'
        "<yg: JSON object key \"1\" would be duplicated after string conversion>"
        exit=0
      Error text becomes an ordinary string value, exit 0, nothing on stderr,
      exactly as described. The `tostring` binding is confirmed upstream:
      jaq-core 3.1.0 filter.rs:469 is `Ast::ToString => box_once(Ok(cv.1
      .into_string()))`. The contrast with native `tojson` (funs.rs:78-83, which
      does `map_err(Error::str)` into `bome`) is accurate, and jaq's
      `fn into_string(self) -> Self` genuinely offers no error channel.

      CORRECTION — the limits attribution is wrong. `into_string` renders with
      `crate::EmitOpts::compact()`, and `EmitOpts::compact()` (emit/mod.rs:130-138)
      inherits `EmitOpts::default()`, whose limits are hard-wired to
      `LoaderConfig::moderate().limits` (emit/mod.rs:61). The run's profile never
      reaches this render, so "EmitError::Limit when the compact rendering exceeds
      max_output_bytes (10 MB under --strict)" is doubly off: the applicable cap is
      moderate's 256 MB regardless of `--strict`, and `--strict` cannot tighten it.
      The reachable `Limit` trigger is moderate's `max_depth` of 256, checked by
      `validate_value` before rendering. Verified:
        $ yg -n 'reduce range(300) as $i (null; [.]) | tostring'
        "<yg: depth 257 exceeds maximum of 256>"
        exit=0
      Suggested rewrite of the first sentence: "`to_json` can fail for two reasons
      that are entirely input-driven: `EmitError::Limit` when the value exceeds the
      *moderate* profile's `max_depth` of 256 or `max_output_bytes` of 256 MB —
      `into_string` renders through `EmitOpts::compact()`, which always carries
      moderate limits regardless of `--strict`/`--trusted` — and
      `EmitError::DuplicateJsonKey` when two distinct YAML keys collapse to the
      same JSON name." Replace the `yg --strict '.big | tostring'` example with
      either of the two reproductions above.

      Remediation survives the correction and is arguably strengthened by it: the
      "render with `ResourceLimits::none()`" option is the right call precisely
      because the limits currently applied are unrelated to the run's policy.
      `moderate` stays proportionate.

  - slug: halt-exit-code-truncated-to-u8
    verdict: ADJUSTED
    notes: |
      Evidence exact: commands/query.rs:610-619, 10 lines, byte-identical; marker
      line 7 is the `*code as u8` cast. `get_halt` extraction at error.rs:57-67 ✓,
      diagnostic suppression for Halt at commands/query.rs:591-596 ✓. The
      truncation is real and reproduced:
        $ yg -n 'halt(256)'  -> exit 0, silent
        $ yg -n 'halt(5)'    -> exit 5

      CORRECTION — the worked example is wrong. `halt(400)` truncates to 144, not
      0 (400 mod 256 = 144), which is still a failure status:
        $ yg -n 'halt(400)'  -> exit 144
      So `yg 'if .bad then halt(400) else . end' || alarm` *does* fire the alarm.
      Only exact multiples of 256 collapse to success. Change the example to
      `halt(256)` (or `halt(512)`), which the finding already names correctly one
      sentence earlier: "A caller writing `yg 'if .bad then halt(256) else . end'
      || alarm` never fires the alarm."

      Everything else stands: `halt(-1)` -> 255, the jq-compatibility framing is
      fair, and the remediation (`u8::try_from` with an explicit fallback and a
      comment, or validation at construction) is sound. `advisory` is
      proportionate — and slightly more so given the corrected blast radius.

  - slug: build-invariant-errors-labeled-as-limit
    verdict: CONFIRMED
    notes: |
      Evidence exact: build.rs:172-174, 3 lines, byte-identical; marker line 1 is
      the `BuildError::Limit(format!(` line. The second site is quoted correctly:
      build.rs:243 is `.ok_or_else(|| BuildError::Limit("unexpected end of parser
      event stream".into()))`. The doc comment at error.rs:23-25 does read "A
      loader resource limit was exceeded", and every other `BuildError::Limit`
      construction in build.rs (lines 31, 96, 159, 214) is a genuine
      `check_*` failure — so these two are the only misfits, as claimed.
      `BuildError` is public and `From<BuildError> for YgError` maps it to
      `InputParse` (error.rs:75-79), so the misclassification does reach the user.
      Both sites are parser-contract violations, not exhaustion. Remediation is
      trivial and safe pre-release. `advisory` is proportionate.

  - slug: in-place-chown-failure-aborts-the-edit
    verdict: CONFIRMED
    notes: |
      Evidence exact: commands/query.rs:326-337, 12 lines including the
      `#[cfg(unix)]` attribute, byte-identical; markers 9-11 point at the chown
      call and its error map. Call site verified: `preserve_owner(...)?` at
      commands/query.rs:235, unconditional, between the fsync (226-234) and
      `set_permissions` (236-243), and before `staged.push` (244-248) — so the
      claim that it precedes persist is right, and the `NamedTempFile` is dropped
      and unlinked on the error path with nothing partially written. The
      inconsistency claim checks out: `warn_if_hard_linked`
      (commands/query.rs:311-321) only prints to stderr, and the symlink case
      (191-195) is the only other refusal, which is deliberate and documented in
      its message. Nothing states the ownership policy and there is no opt-out.
      Remediation (match on `ErrorKind`, then warn-or-fail consistently, and say
      which in the help text) is sound. `advisory` is proportionate — the failure
      is clean and non-destructive.

  - slug: unreachable-macros-guard-unstated-invariants
    verdict: CONFIRMED
    notes: |
      Evidence exact: emit/yaml.rs:74-80, 7 lines, byte-identical; marker line 5
      is the `unreachable!`. The census is right: grep for `unreachable!` outside
      tests returns exactly four hits, at build.rs:254, emit/yaml.rs:78,
      emit/yaml.rs:237 and emit/yaml.rs:252 — the four cited lines, no drift.

      Each reachability argument re-traced and each holds:
      - `block_collection` is called from `node` (yaml.rs:71, guarded by the
        early return at 57), `sequence` (yaml.rs:102, guarded at 84) and
        `mapping_entry` (yaml.rs:139, guarded at 131) — the exact three call
        sites named.
      - yaml.rs:237 sits in `inline`'s scalar arm, which calls
        `self.scalar(value, Position::Flow)` (yaml.rs:235); `string()`'s
        `block_allowed` (yaml.rs:259-263) excludes `Position::Flow`, and
        `Rendered::Literal` is only produced at yaml.rs:271-273 under
        `block_allowed`, so the arm is dead.
      - `scalar()` is entered from yaml.rs:162, 190 and 235, all of which sit
        behind arms that have already dispatched `Data::Seq`/`Data::Map`
        elsewhere.
      - `core_value_to_data` has three callers (build.rs:186, build.rs:264,
        value.rs:373) and every one feeds it `TagResolution::resolve_scalar`
        output through the concrete crate-owned enum, never a foreign
        `TagResolver` impl.

      `note` is the right level, and recording it as a pass on 11.4 rather than a
      defect is correct. Remediation asks for nothing mandatory.
  # ---------------------------------------------------------------------------
  # narrative: allocation-and-throughput
  # ---------------------------------------------------------------------------
  - slug: build-raw-metadata-duplicates-every-scalar
    verdict: CONFIRMED
    notes: |
      Evidence matches crates/yamalgam-query/src/build.rs:189-207 exactly (the block is
      dedented by 4 spaces relative to source, content is character-identical). Markers
      correct: relative line 14 = build.rs:202 `raw: raw.map(Rc::from),`; relative line 18
      = build.rs:206 `meta: Some(Rc::new(meta)),`.

      Explicitly checked the parent's question: raw retention is NOT gated. The scalar arm
      at build.rs:102-111 passes `Some(&value)` into `finish()` unconditionally for every
      Scalar event; collections pass `None`. There is no flag, style test, or
      metadata-preservation mode anywhere in the path — grepped LoaderConfig
      (crates/yamalgam-core/src/loader.rs) for any `raw`-related knob: none exists. So the
      duplication is real, unconditional, and per-scalar.

      Duplication is genuine for string-valued scalars: resolve_scalar (build.rs:179-187)
      produces `Data::Str(Rc::from(text))` for both the non-plain branch (line 184) and the
      plain-string fallback (via core_value_to_data, build.rs:252), and finish() then builds
      a second independent `Rc<str>` from the same bytes. Three allocations per scalar as
      claimed (Data::Str, meta.raw, Rc::new(meta)).

      Remediation is sound. `raw` is fed the *cooked* event value (`&value`), the same
      `&str` that `Data::Str` is built from, so an `Rc::clone` of the resolved allocation is
      byte-identical to what `Rc::from(raw)` would produce — sharing changes nothing
      observable. Consumers only read `meta.raw` (value.rs:342/347/363), never mutate it in
      place; `data_mut()` clears it on mutation (value.rs:267). No aliasing hazard.

      Two nits for the auditor, neither changing the finding:
        - The title ("Every scalar's bytes are stored twice") overstates slightly: for plain
          scalars resolving to Int/Float/Bool/Null the bytes are stored once (in meta.raw)
          plus a non-byte Data variant. The mechanism text already qualifies this correctly
          ("for the overwhelmingly common string case"); the title does not.
        - `significant` sits at the top of its defensible range for a no-correctness-impact
          memory finding, and the narrative's own verdict calls it "a design decision rather
          than a defect". Defensible as the headline of the perf surface; left as-is per the
          "respect the auditor's judgment" rule.

