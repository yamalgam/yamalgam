  - slug: validate-value-collects-and-sorts-needlessly
    verdict: DISPUTED
    notes: |
      The evidence block itself is exact (crates/yamalgam-query/src/emit/mod.rs:109-122, all
      14 lines, markers relative 6 = mod.rs:114 and relative 7-9 = mod.rs:115-117). The
      problem is the mechanism's central assertion and the remediation that follows from it.

      CLAIM DISPUTED: "All of those checks are order-independent, so sorting the entries
      changes nothing about the outcome." The alias-expansion check is order-DEPENDENT.
      validate_value's own loop at emit/mod.rs:81-95 maintains an `anchors` set of anchors
      seen so far, and at mod.rs:83 computes
      `emits_reference = format == EmitFormat::Yaml && anchors.contains(alias)`; when true it
      `continue`s without counting an expansion, when false it increments
      `expanded_aliases` and calls `check_alias_expansions`. Whether a given alias counts is
      therefore a function of traversal order.

      That order must match the emitter's emission order, and the emitter sorts: yaml.rs:328
      `Context::entries` applies the same `sort_by` when `sort_keys` is set, and
      `alias_is_emittable` (yaml.rs:336-341) tests `anchors_emitted`, populated by
      `record_anchor` (yaml.rs:375-379) in emission order. So the sort in validate_value is
      load-bearing: it aligns the validator's anchor/alias visitation with the emitter's.

      Concretely, with `--sort-keys` on a document like `{b: &x <big>, a: *x}`: YAML source
      order guarantees the anchor precedes the alias, but sorted order reverses that, so the
      emitter expands the alias. With the sort removed from validate_value only, the
      validator would visit `b` first, record anchor `x`, treat `*x` as a reference, and
      count zero expansions — silently under-counting exactly the metric that
      `check_alias_expansions` exists to bound (the Billion Laughs guard). Applying this
      finding's remediation as written would weaken that limit on the sort_keys path.

      The `collect` cannot be dropped independently either: you cannot sort without
      materializing.

      What survives is narrower and is already covered elsewhere: when `sort_keys` is false,
      the collect is avoidable because `mapping.0.iter().rev()` yields the same order.
      That is precisely `mapping-entries-collected-into-vec-per-emit` (advisory), whose
      remediation correctly branches on the flag instead of deleting the sort. Recommend
      dropping this finding and keeping that one — the two also point at the same
      emit/mod.rs:114-117 code, so they are partial duplicates across narratives.

