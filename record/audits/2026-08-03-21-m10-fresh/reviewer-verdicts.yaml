          bome(Ok(YamlVal::str(context_value.1.type_name()))) })` — byte-identical
          body to `resolved_type`. Confirmed exact alias.
        - crates/yamalgam-query/src/defs.jq:3 is `def type: _yaml_type;` as cited.
        - Plan line 2844 is verbatim "...the doc comment should say so."
        - No doc comment exists at the registration (only the
          `// r[impl ext.resolved-type]` tracey tag), and grep of the
          implementation-notes doc for `resolved_type|resolved-type` returns
          zero hits — so the claim that it is absent from the 13 deviations
          holds.

      CORRECTION: the mechanism states "A user reading spec §6.2 sees `kind`,
      `resolved_type`, and `type` presented as three distinct introspection
      filters." §6.2 (spec lines 355-368) actually contains four rules —
      r[ext.resolved-type], r[ext.kind], r[ext.is-alias], r[ext.raw] — and
      `type` is NOT among them; it appears only inside the r[ext.resolved-type]
      prose. Reword to: spec line 358 explicitly contrasts the two ("`type`
      returns \"boolean\"... `resolved_type` always returns the resolution
      result under the active schema"), so the spec presents them as
      distinguishable even though §6.2 does not define `type` itself. The
      conclusion — a reader will assume `resolved_type` differs from `type`,
      and it does not — is unaffected and if anything better supported by the
      direct quote than by the §6.2 framing.

      `note` is proportionate; remediation (doc comment plus a notes-doc entry)
      is sound.

