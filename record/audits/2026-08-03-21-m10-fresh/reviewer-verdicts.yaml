  - slug: librebar-upgrade-expands-trust-boundary
    verdict: ADJUSTED
    notes: |
      Finding is real and the crate research is accurate; the last sentence of
      the remediation is wrong and would not work.

      Verified correct:
        - Evidence (Cargo.toml:46) exact; marker correct.
        - Lock delta verified: `git show main:Cargo.lock` has 211 `[[package]]`
          entries, the branch has 197. The finding's "211 before, 197 after" is
          exact.
        - `rust-zstd v0.1.0 <- librebar <- yamalgam`, sole path. Its manifest
          description is verbatim "Pure Rust Zstandard codec — compress +
          decompress, zero external dependencies", repository
          github.com/physwkim/rust-zstd. grep for `unsafe` across its src/
          returns nothing, so the "pure safe Rust" mitigation is accurate.
        - `leakguard v0.8.0 <- librebar <- yamalgam`, sole path. lib.rs:75 is
          `#![forbid(unsafe_code)]`; manifest confirms zero-dependency and
          repository github.com/ptukovar/leakguard.

      CORRECTION: the remediation ends "If log compression is not something
      `yg` actually exercises, dropping the `diagnostics` feature removes
      rust-zstd, leakguard, and tar in one move." It does not. Per
      librebar-0.4.0/Cargo.toml, `logging = [dep:tracing-subscriber,
      dep:tracing-appender, dep:serde_json, dep:directories, dep:rust-zstd]` —
      `logging` declares rust-zstd independently, and `logging` is explicitly
      requested by this manifest (and is also a prerequisite of `diagnostics`).
      Dropping `diagnostics` removes leakguard and tar only; rust-zstd — the
      decompressor, i.e. the crate the finding is actually most concerned
      about — stays. Reword to: dropping `diagnostics` removes leakguard and
      tar; removing rust-zstd additionally requires librebar to make it
      optional under `logging`, which the preceding sentence already correctly
      identifies as upstream work.

      Everything else stands. The mechanism's own phrasing ("both via the
      `logging` and `diagnostics` features") is compatible with the corrected
      picture. `advisory` proportionate — this is thin-ice trust surface, not a
