testing:
  runner: just
  command: just test
  sources:
    - .justfile
    - .config/nextest.toml
  notes: "The repository requires `just` recipes; `just test` invokes cargo-nextest.
    Do not invoke `cargo test` directly for the workspace suite."
boundaries:
  - name: untrusted_yaml_processing
    description: "Scanner, parser, CST recovery, composition, query, and schema validation consume adversarial YAML and schemas."
    modules: [yamalgam-scanner, yamalgam-parser, yamalgam-cst, yamalgam-compose, yamalgam-query, yamalgam-schema]
    notes: "Review stack depth, progress guarantees, diagnostic bounds, regex behavior, and native custom-value adaptation."
  - name: external_resource_retrieval
    description: "File and network resource resolution crosses workspace, symlink, URI, and byte-budget policy boundaries."
    modules: [yamalgam-resolve, yamalgam-schema, yamalgam-lsp, yamalgam]
    notes: "Network is denied by default; verify capability roots, redaction, cache accounting, and SchemaStore opt-in behavior."
  - name: lsp_stdio_and_document_state
    description: "The language server accepts framed editor messages and maintains versioned Rowan/Ropey document state."
    modules: [yamalgam-lsp, yamalgam-cst, yamalgam-schema]
    notes: "Review stdout framing, cancellation and stale-version races, UTF-16 conversion, and bounded diagnostics."
  - name: cli_and_query_reports
    description: "CLI and query frontends expose validation, retrieval failures, diagnostics, and machine-readable output."
    modules: [yamalgam, yamalgam-query, yamalgam-schema, yamalgam-resolve]
    notes: "Review exit contracts, deterministic ordering, structured errors, and sensitive URI redaction."
