                          let locations = items.iter().map(|item| item.locations.clone()).collect();
                          let value = LocatedValue {
                              value: Value::Sequence(items.into_iter().map(|item| item.value).collect()),
                              locations: ValueLocations {
                                  span: encompassing_span(start_span, end_span),
                                  kind: LocationKind::Sequence(locations),
                              },
                          };
        evidence_lang: rust
        evidence_markers:
          - lines: "2"
            type: mark
            label: "Value-only callers always take the located path"
          - lines: "9"
            type: del
            label: "Owned child locations are deep-cloned before originals are dropped"
        mechanism: |
          The composer owns each `LocatedValue` but clones complete child location
          subtrees before consuming only their values. Nested sequences repeat that
          work, and value-only callers build the entire location tree only to discard it.
        remediation: |
          Move-unzip each `LocatedValue` once and provide a value-only accumulator path
          that does not build locations.
        effort: medium
        effort_notes: "Move-unzip is small; avoiding location construction needs an accumulator refactor."
        chains:
          enables: []
          enabled_by: []
          related: [located-value-allows-invalid-parallel-shapes]

  - slug: retrieval-and-dependency-lifecycle
    title: "Retrieval and Dependency Lifecycle"
    thesis: "The retrieval boundary is policy-conscious and dependency checks pass, but worker failure reporting and two dependency feature choices remain imperfect."
    verdict: "No workspace FFI or advisory/license failure was found. The remaining issues are a silently discarded worker panic, Ropey defaults already captured in the LSP narrative, and upstream Librebar Tokio features that enlarge the shipped graph without serving Yamalgam's HTTP path."
    findings:
      - slug: http-worker-panic-result-discarded
        title: "HTTP worker panics are silently discarded during shutdown"
        criterion: "5.3"
        surface: "Error Handling"
        concern: moderate
        locations:
          - path: crates/yamalgam-resolve/src/retriever/http.rs
            start_line: 144
            end_line: 156
        evidence: |
          impl Drop for LibrebarRetriever {
              fn drop(&mut self) {
                  self.work.take();
                  let worker = self
                      .worker
                      .get_mut()
                      .unwrap_or_else(|poisoned| poisoned.into_inner())
                      .take();
                  if let Some(worker) = worker {
                      let _ = worker.join();
                  }
              }
          }
        evidence_lang: rust
        evidence_markers:
          - lines: "10"
            type: del
            label: "The panic payload is discarded"
        mechanism: |
          A worker panic becomes a generic channel closure for the caller, then Drop
          discards the join result and the remaining panic payload. Operators cannot
          distinguish a worker defect from an ordinary shutdown.
        remediation: |
          Record typed worker termination in shared state, expose a fallible explicit
          shutdown boundary, and emit a structured event from Drop as a final fallback.
        effort: small
        effort_notes: "Adds shared termination state and a non-Drop shutdown path."

      - slug: librebar-http-enables-unused-tokio-subsystems
        title: "Librebar HTTP activates Tokio signal and macro features unused by retrieval"
        criterion: "13.8"
        surface: "Dependency Fitness"
        concern: advisory
        locations:
          - path: crates/yamalgam-resolve/Cargo.toml
            start_line: 15
            end_line: 18
        evidence: |
          librebar = { version = "0.6.0", default-features = false, features = ["http"] }
          percent-encoding = "2.3"
          thiserror = "2.0"
          tokio = { version = "1.52", features = ["rt", "sync"] }
        evidence_lang: toml
        evidence_markers:
          - lines: "1"
            type: mark
            label: "The upstream HTTP feature controls the transport graph"
          - lines: "4"
            type: mark
            label: "Yamalgam itself requests only runtime and synchronization"
        mechanism: |
          Librebar's `http` feature enables Tokio macros, signal, sync, time, and rt.
          Cargo feature unification adds signal and macro support even though neither
          Yamalgam's retriever nor Librebar's production HTTP path uses them.
        remediation: |
          Narrow Librebar's base Tokio features upstream, move signal behind its
          shutdown feature and macros to dev-dependencies, then update Yamalgam.
        effort: medium
        effort_notes: "Requires an upstream Librebar release; Yamalgam's boundary stays unchanged."

