        mechanism: |
          Request handlers run synchronously in the only receiver loop, so a cancel
          notification cannot be observed until active work has already completed.
          A late cancellation is then retained until a future request reuses the ID,
          causing ineffective cancellation, unbounded stale state, and false cancels.
        remediation: |
          Track active requests separately from completed IDs, execute cancellable work
          outside the receiver loop, and remove cancellation state on every completion.
        effort: medium
        effort_notes: "Requires a bounded worker/cancellation lifecycle, not just a set cleanup."

