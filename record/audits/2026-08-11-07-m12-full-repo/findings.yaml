        evidence_lang: rust
        evidence_markers:
          - lines: "1-10"
            type: mark
            label: "Requests and cancellation notifications share one serial receiver"
          - lines: "26-28"
            type: del
            label: "Request work completes synchronously before another message is read"
          - lines: "43-50"
