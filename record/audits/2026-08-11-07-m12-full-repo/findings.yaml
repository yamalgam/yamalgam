      - slug: ropey-unicode-lines-desynchronize-lsp-positions
        title: "Ropey defaults broaden line splitting beyond the LSP position model"
        criterion: "13.8"
        surface: "Dependency Fitness"
        concern: moderate
        locations:
          - path: crates/yamalgam-cst/Cargo.toml
            start_line: 12
            end_line: 12
        evidence: |
          ropey = "1.6.1"
        evidence_lang: toml
        evidence_markers:
          - lines: "1"
            type: del
            label: "Implicit defaults enable unicode_lines"
        mechanism: |
          Ropey's default `unicode_lines` feature treats VT, FF, NEL, U+2028, and
          U+2029 as line boundaries. The LSP position model uses CR, LF, and CRLF.
          Delegating line lookup to Ropey while trimming only LSP line endings shifts
          diagnostics and navigation when those scalar characters occur in YAML.
        remediation: |
          Disable Ropey defaults and explicitly enable only `cr_lines` and `simd`.
          Add UTF-16 conversion regressions for U+2028, U+2029, CR, LF, and CRLF.
        effort: small
        effort_notes: "One feature declaration plus focused position tests."
        temporal:
          introduced: 2026-08-10
          last_modified: 2026-08-10
          commit_count: 1

