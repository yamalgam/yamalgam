audit_date: 2026-08-11
scope: "Full Yamalgam workspace at the M12 schema-validation and language-server release boundary"
commit: 7afeea1e98dd987fb8d014e46cc29cc57b2faca5
assessment: |
  M12 is functionally broad and its deterministic gates are clean, but the fresh
  static review found release-relevant gaps at the editor/schema boundary. The
  highest-risk cluster is semantic drift between YAML documents and LSP positions:
  leading document markers and sequence ancestry can select the wrong schema, while
  Ropey's default line model disagrees with the LSP. Schema compilation also has an
  identity-unsafe validator cache, unbounded adapter recursion, and several hot paths
  whose advertised limits bound retained output rather than work. The scanner,
  parser, query engine, dependency advisories, license policy, and workspace unsafe
  census were otherwise clean in the supplied evidence.

