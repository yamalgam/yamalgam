        evidence: |
          /// Run the language server over standard input and standard output.
          pub fn run_stdio() -> Result<(), ServerError> {
              let (connection, threads) = Connection::stdio();
              let result = run(connection);
              threads.join()?;
              result
              while let Ok(message) = connection.receiver.recv() {
                  match message {
                      Message::Request(request) => {
                          if connection.handle_shutdown(&request)? {
                              return Ok(());
                          }
                          server.handle_request(&connection, request)?;
                      }
                      Message::Notification(notification) => {
                          server.handle_notification(&connection, notification)?;
                      }
                      Message::Response(_) => {}
                  }
              }
              Ok(())
        evidence_lang: rust
        evidence_markers:
          - lines: "4-5"
            type: del
            label: "Every return path joins both stdio threads before returning the error"
          - lines: "7-20"
            type: mark
            label: "Protocol and handler errors can leave stdin open"
        mechanism: |
          If `run` returns early on a protocol or handler error while the client keeps
          stdin open, `IoThreads::join` waits for the blocking reader thread. The server
          cannot report the original error or terminate.
        remediation: |
          Join only after clean shutdown or EOF, or use a transport lifecycle that can
          explicitly stop the reader before joining on an error path.
        effort: small
        effort_notes: "The join policy is localized, but must preserve clean shutdown."

