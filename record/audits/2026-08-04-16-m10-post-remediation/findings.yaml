- slug: feature-completeness
  title: The Feature Completeness Surface
  thesis: Several public promises are broader than the behavior users can currently
    reach, including an intentionally deferred loader policy and universal CST losslessness.
  verdict: This surface has the largest documentation-to-runtime gaps. The resolver
    architecture is only partly composable, deferred loader resolution settings are
    accepted without an unsupported-capability error, eight valid flow documents violate
    the lossless-CST contract, and shipped configuration examples advertise ignored settings.
