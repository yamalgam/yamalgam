    title: Synthetic flow-pair finalization consumes scanner errors while calculating
      a span
    criterion: '5.3'
    surface: Error Handling
    concern: moderate
    locations:
    - path: crates/yamalgam-parser/src/parser.rs
      start_line: 1167
      end_line: 1179
    evidence: |2
          fn parse_flow_sequence_entry_mapping_end(
              &mut self,
          ) -> Result<Option<Event<'input>>, ParseError> {
              let span = self
                  .peek_token()
                  .ok()
                  .flatten()
                  .map_or_else(Span::default, |t| Span {
                      start: t.atom.span.start,
                      end: t.atom.span.start,
                  });
              self.state = ParserState::FlowSequenceEntry;
              Ok(Some(Event::MappingEnd { span }))
    evidence_lang: rust
    evidence_markers:
    - lines: 5-7
      type: mark
      label: ParseError is converted to absence after consuming the scanner item
    mechanism: 'peek_token obtains its value through self.tokens.next().transpose(),
      so an Err consumes the scanner error. Converting that result with ok() replaces
      ParseError::Scan with None, emits a default-span MappingEnd, and advances parser
      state. Invalid input immediately following an implicit mapping in a flow sequence
      can therefore lose the original machine-readable ScanErrorKind and message;
      a later generic EOF error may replace it. Six similar ok().flatten() span probes
      make the same fragile assumption that a token was already buffered.

      '
    remediation: 'Propagate the error with self.peek_token()? and map only the Option.
      Sweep all seven ok().flatten() span probes, retaining a default span only for
      genuine None, and add a malformed flow-pair regression that asserts the original
      scanner error kind survives.

      '
    temporal:
      introduced: '2026-03-07'
      last_modified: '2026-06-10'
    chains:
      enables: []
      enabled_by: []
      related:
      - cst-discards-parse-error
