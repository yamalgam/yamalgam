  - slug: composer-default-path-has-unbounded-recursion
    title: Default composition recursively descends untrusted YAML without a depth
      bound
    criterion: '11.5'
    surface: Panic & Program Flow
    concern: significant
    locations:
    - path: crates/yamalgam-compose/src/lib.rs
      start_line: 272
      end_line: 285
    evidence: |2
                  Event::SequenceStart { anchor, .. } => {
                      let mut items = Vec::new();
                      loop {
                          let Some(peeked) = self.peek_event()? else {
                              return Err(ComposeError::UnexpectedEvent(
                                  "unterminated sequence".into(),
                              ));
                          };
                          if matches!(peeked, Event::SequenceEnd { .. }) {
                              self.next_event()?;
                              break;
                          }
                          items.push(self.compose_node()?);
                      }
    evidence_lang: rust
    evidence_markers:
    - lines: '13'
      type: mark
      label: recursive call has no depth counter or local limit check
    mechanism: 'compose_node recursively descends every nested sequence and mapping
      without carrying depth. The public from_str and from_str_single paths reach
      it through Parser::new and Composer::new, both of which use ResourceLimits::none
      rather than LoaderConfig''s moderate default. Deeply nested external YAML can
      therefore grow the Rust call stack until the process aborts; dropping the resulting
      recursive Value can repeat the same failure. Even Composer::new_with_config
      relies on its event source to enforce max_depth instead of enforcing the advertised
      limit locally.

      '
    remediation: 'Thread a depth argument through compose_node, call self.config.check_depth
      before descending, and use checked_add for child depth. Route the convenience
      from_str paths through LoaderConfig::default; retain unlimited behavior only
      behind an explicitly named unchecked constructor.

      '
    temporal:
      introduced: '2026-03-08'
      last_modified: '2026-03-08'
