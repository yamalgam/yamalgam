      allocation and copy for the reference-counted layout. The same module already has
      `char_byte_range` and uses a borrowed substring in the range-update path, so this
      read path retains a duplicate allocation the adjacent implementation avoids.
    remediation: |
      Reuse `char_byte_range`: compute `(start_byte, end_byte)` from `skip` and `take`,
      then call `Self::str(&string[start_byte..end_byte])`. This removes the intermediate
      String and leaves the single allocation required for Rc<str>. Add ASCII and multibyte
      range tests to pin jq character-index semantics.
