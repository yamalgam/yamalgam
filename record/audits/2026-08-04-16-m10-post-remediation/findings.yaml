  - slug: composer-mapping-insertion-is-quadratic
    title: Composer mapping insertion is quadratic in mapping width
    criterion: '12.1'
    surface: Performance
    concern: significant
    locations:
    - path: crates/yamalgam-core/src/value.rs
      start_line: 67
      end_line: 77
    - path: crates/yamalgam-compose/src/lib.rs
      start_line: 296
      end_line: 317
    evidence: |2
          /// Inserts a key/value pair. If the key already exists, its value is
          /// replaced and the old value is returned.
          pub fn insert(&mut self, key: Value, value: Value) -> Option<Value> {
              for entry in &mut self.entries {
                  if entry.0 == key {
                      let old = std::mem::replace(&mut entry.1, value);
                      return Some(old);
                  }
              }
              self.entries.push((key, value));
              None
    evidence_lang: rust
    evidence_markers:
    - lines: 4-9
      type: mark
      label: every insertion rescans all previously inserted entries
    mechanism: |
      `Mapping` preserves order in a `Vec`, and `Composer` calls `insert` once for
      every non-merge mapping pair. Inserting n distinct scalar keys therefore
      performs n(n-1)/2 equality checks; collection-valued keys make each check
      recursive as well. This path consumes untrusted YAML, and the composer does
      not enforce `max_collection_size`, so the strict input-byte limit still permits
      a wide document that spends quadratic CPU before composition completes.
    remediation: |
      Keep the ordered entry vector, but add a randomized side index from equality-safe
      scalar keys to entry positions and use the linear fallback only for keys such as
      NaN or collection-valued keys whose current `PartialEq` semantics cannot safely
      back `Eq + Hash`. Enforce `max_collection_size` in the sequence and mapping
      composition loops as a defense-in-depth bound, and add a wide-map benchmark.
    temporal:
      introduced: '2026-03-08'
      last_modified: '2026-06-10'
