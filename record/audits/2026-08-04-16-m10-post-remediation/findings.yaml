  - slug: composer-alias-deep-clone-is-size-unbudgeted
    title: Alias expansion deep-clones entire DOM subtrees under a count-only budget
    criterion: '3.1'
    surface: Performance
    concern: significant
    locations:
    - path: crates/yamalgam-compose/src/lib.rs
      start_line: 343
      end_line: 355
    - path: crates/yamalgam-core/src/value.rs
      start_line: 23
      end_line: 41
    evidence: |2
                  Event::Alias { name, .. } => {
                      self.alias_expansion_count += 1;
                      if let Err(msg) = self
                          .config
                          .check_alias_expansions(self.alias_expansion_count)
                      {
                          return Err(ComposeError::LimitExceeded(msg));
                      }
                      let name_str = name.into_owned();
                      self.anchors
                          .get(&name_str)
                          .cloned()
                          .ok_or(ComposeError::UndefinedAlias(name_str))
    evidence_lang: rust
    evidence_markers:
    - lines: 2-5
      type: mark
      label: the budget counts aliases but not cloned subtree size
    - lines: 10-12
      type: mark
      label: Value::clone recursively copies owned strings and collections
    mechanism: |
      Core `Value` derives `Clone` over owned `String`, `Vec<Value>`, and `Mapping`, so
      `.cloned()` recursively allocates and copies the complete anchored subtree for
      every alias. The only guard counts alias occurrences: cloning a large but legal
      anchor 100 times under the strict profile, or 10,000 times under the default
      profile, can multiply memory and CPU far beyond the input-size limit without
      exceeding the alias count.
    remediation: |
      Store a cached node/byte weight with each anchored value and charge that weight
      to an expanded-node or expanded-byte budget before cloning. Reject the alias when
      the cumulative expansion would exceed the configured collection/output bound.
      A future shareable DOM representation can make immutable alias clones cheap, but
      the size-weighted budget is the compatible fix for the current public `Value` API.
    temporal:
      introduced: '2026-03-08'
      last_modified: '2026-03-27'
