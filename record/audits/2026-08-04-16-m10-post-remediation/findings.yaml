    title: The query builder allocates a depth stack and rewalks every completed node
    criterion: '12.5'
    surface: Performance
    concern: significant
    locations:
    - path: crates/yamalgam-query/src/value.rs
      start_line: 210
      end_line: 230
    - path: crates/yamalgam-query/src/build.rs
      start_line: 287
      end_line: 292
    evidence: |2
          pub(crate) fn check_depth(&self, limits: &yamalgam_core::ResourceLimits) -> Result<(), String> {
              let mut stack = vec![(self, 0_usize)];
              while let Some((value, depth)) = stack.pop() {
                  limits.check_depth(depth)?;
                  let child_depth = depth
                      .checked_add(1)
                      .ok_or_else(|| "value depth overflow".to_owned())?;
                  match &value.data {
                      Data::Seq(items) => {
                          stack.extend(items.iter().map(|item| (item, child_depth)));
                      }
                      Data::Map(mapping) => {
                          stack.extend(
                              mapping
                                  .0
                                  .iter()
                                  .flat_map(<[_; 2]>::from)
                                  .map(|item| (item, child_depth)),
                          );
                      }
                      Data::Null | Data::Bool(_) | Data::Int(_) | Data::Float(_) | Data::Str(_) => {}
    evidence_lang: rust
    evidence_markers:
    - lines: 2-3
      type: mark
      label: a fresh heap-backed traversal stack is created for every node
    - lines: 9-20
      type: mark
      label: completed descendants are traversed again
    mechanism: |
      `Builder::finish` invokes `check_depth` for every completed scalar, sequence, and
      mapping. Scalars therefore pay a fresh `Vec` allocation for a one-node check, and
      each collection walks its entire completed subtree. Nested documents revisit each
      descendant once per ancestor, adding O(nodes * depth) work even though the recursive
      builder already knows each child's depth and the configured depth bound.
    remediation: |
      Have the private node builder return `(YamlVal, subtree_height)`, compute collection
      height from child heights, and store `(YamlVal, subtree_height)` for anchors. Alias
      nodes then carry the cached target height, so the expanded-depth check remains correct
      without allocating a traversal stack or rewalking completed subtrees.
    temporal:
      introduced: '2026-08-02'
      last_modified: '2026-08-04'
      commit_count: 23
