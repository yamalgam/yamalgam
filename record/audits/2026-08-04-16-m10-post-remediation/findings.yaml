    evidence: |2
          /// Parse and compose all documents using a custom tag resolver.
          pub fn from_str_with_tag_resolver(
              input: &'input str,
              tag_resolver: impl TagResolver + 'static,
          ) -> Result<Vec<Value>, ComposeError> {
              let parser = Parser::new(input);
              let events = ResolvedEvents::new(
                  Box::new(parser.map(|r| r.map_err(ResolveError::Parse))),
                  NoopResolver,
              );
              let mut composer = Composer {
                  events: events.peekable(),
                  anchors: HashMap::new(),
                  config: ResourceLimits::none(),
                  alias_expansion_count: 0,
                  tag_resolver: Box::new(tag_resolver),
              };
              composer.compose_stream()
    evidence_lang: rust
    evidence_markers:
    - lines: '4'
      type: del
      label: rejects borrowed resolver state
    - lines: '16'
      type: mark
      label: Box defaults to a static trait object
    mechanism: |
      The method consumes the entire stream and returns owned Values before the
      call ends, yet the Box<dyn TagResolver> field forces the resolver to be
      static. A resolver borrowing a caller-owned lookup table or configuration
      is rejected even when that state outlives the synchronous call.
    remediation: |
      Parameterize Composer over its resolver type, or add a resolver lifetime
      to the trait object so this entry point can accept borrowed implementations.
