    title: Borrowed string lookup allocates an owned Value key
    criterion: 3.3 - Functions Accept References When Callee Does Not Need Ownership
    surface: Ownership & Borrowing
    concern: advisory
    locations:
    - path: crates/yamalgam-core/src/value.rs
      start_line: 128
      end_line: 134
    evidence: |2
          #[must_use]
          pub fn get(&self, key: &str) -> Option<&Self> {
              match self {
                  Self::Mapping(m) => m.get(&Self::String(key.to_owned())),
                  _ => None,
              }
          }
    evidence_lang: rust
    evidence_markers:
    - lines: '4'
      type: mark
      label: allocates solely for comparison
    mechanism: |
      The public API correctly accepts a borrowed str, but each lookup converts it
      into an owned String and wraps it in Value before performing a linear scan.
      The temporary allocation is discarded immediately, so repeated lookups pay
      a per-call allocator and copy cost without any ownership requirement.
    remediation: |
      Add a borrowed string-key lookup on Mapping that directly matches
