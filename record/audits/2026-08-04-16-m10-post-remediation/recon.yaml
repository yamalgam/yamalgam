testing:
  runner: just
  command: just test
  sources:
    - .config/scrat.toml
  notes: >-
    `.config/nextest.toml` is present; `just test` invokes `cargo nextest run`.
    Do not invoke `cargo test` directly because env-mutating tests assume nextest
    process isolation. The audited commit passed `just check` immediately before
    this static audit (formatting, warning-denied clippy, cargo-deny, 1,858 nextest
    tests, and doc tests). The audit's focused Crustoleum run also passed clippy,
    cargo-deny, and cargo-udeps; cargo-audit reported only the explicitly allowed,
    benchmark-only RUSTSEC-2023-0051 warning. cargo-machete reported two unused
    xtask declarations. cargo-geiger did not produce a trustworthy census because
    it failed to match current registry package identities, so first-party unsafe
    coverage relies on the repository's compiler-enforced `just unsafe-census`.
    No cargo-bloat artifact was collected, so binary-size criteria were not
    quantitatively evaluated.
