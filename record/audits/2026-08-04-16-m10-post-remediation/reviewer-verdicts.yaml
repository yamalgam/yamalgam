  - slug: mapping-omits-intoiterator
    verdict: adjusted
    notes: "Lower concern to note. Existing iter, keys, and values provide complete borrowed traversal at crates/yamalgam-core/src/value.rs:86-99; missing IntoIterator is an additive ergonomics gap, not an advisory-level safety or behavioral limitation."
  - slug: resource-limits-omits-copy
    verdict: disputed
    notes: "Nine Copy-capable fields do not establish that this public configuration type should itself be Copy. ResourceLimits contains nine Option<usize> fields at crates/yamalgam-core/src/loader.rs:177-197; keeping copies explicit is a valid API and evolution choice, so omission of Copy is not an actionable defect."
  - slug: mapping-default-manually-matches-derive
