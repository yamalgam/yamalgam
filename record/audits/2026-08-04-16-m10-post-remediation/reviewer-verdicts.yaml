  - slug: identity-inventory-allocates-path-node-per-map-key
    verdict: adjusted
    notes: "The allocation finding stands, but the runtime flow must make identity inventory conditional. IdentityInventory::collect is invoked only by alias_report and orphan_anchors at crates/yamalgam-query/src/value.rs:665-681, not by every query between value construction and filter evaluation."
  - slug: string-range-retains-intermediate-string
    verdict: adjusted
    notes: "The finding stands, but the runtime flow must make slicing conditional, and the remediation should be described as a single-allocation path rather than allocation-free. The current double-copy path is at crates/yamalgam-query/src/valt.rs:145-149, while char_byte_range at crates/yamalgam-query/src/valt.rs:477-484 removes only the intermediate String; constructing Rc<str> still allocates."
  - slug: parser-consumers-erase-concrete-hot-path-types
    verdict: adjusted
    notes: "Lower concern to note and require profiling before the proposed public generic refactor. The vtable calls are real, but the accepted architecture explicitly treats this indirection as noise unless profiling proves otherwise at docs/decisions/0007-resolver-trait-for-event-stream-middleware.md:106-110, and yamalgam-serde intentionally uses erasure to limit monomorphization at crates/yamalgam-serde/src/lib.rs:1-5."
  - slug: scanner-error-branches-remain-in-hot-functions
    verdict: adjusted
    notes: "Lower concern to note and qualify the mechanism as a possible code-layout optimization. crates/yamalgam-scanner/src/scanner.rs:354-375 proves that error construction is lexically inline, but it does not establish generated instruction layout or measurable scanner cost; benchmark or inspect codegen before applying a broad cold-helper rewrite."
  - slug: xtask-unused-serde-and-toml
