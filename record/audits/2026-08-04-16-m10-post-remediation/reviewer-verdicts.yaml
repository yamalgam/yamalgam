  - slug: cst-discards-parse-error
    verdict: adjusted
    notes: "The finding stands, but remove flow-pair-finalization-swallows-scanner-errors from enabled_by. That parser path suppresses the error and returns MappingEnd successfully at crates/yamalgam-parser/src/parser.rs:1170-1179, whereas CstBuilder only invokes handle_error for an Err it actually receives at crates/yamalgam-cst/src/lib.rs:243-249."
  - slug: from-reader-erases-io-errors
    verdict: adjusted
    notes: "The typed-error finding stands, but its flow placement is wrong: read_to_string can fail before from_str and therefore before scanning or parsing at crates/yamalgam-serde/src/lib.rs:87-91. Move this branch ahead of the scan step."
  - slug: borrowed-value-get-allocates-key
    verdict: adjusted
    notes: "Lower concern to advisory and frame this as a per-lookup allocation cost, not a moderate robustness issue. The API already accepts &str but allocates only inside the lookup at crates/yamalgam-core/src/value.rs:129-132."
  - slug: serde-peek-clones-owned-event
    verdict: confirmed
  - slug: custom-tag-resolver-requires-static
