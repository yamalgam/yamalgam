  - slug: serde-default-disables-loader-limits
    verdict: adjusted
    notes: "The finding stands, but the loading flow must branch: yamalgam_serde::from_str constructs and consumes Deserializer directly at crates/yamalgam-serde/src/lib.rs:31-44 and never enters Composer, so the serde branch must not continue to compose."
  - slug: cst-recursive-traversals-have-no-depth-bound
    verdict: adjusted
    notes: "The finding stands, but the loading flow must terminate in a CST path: parse_to_cst passes Parser directly to CstBuilder at crates/yamalgam-cst/src/lib.rs:560-564 and never enters Composer."
