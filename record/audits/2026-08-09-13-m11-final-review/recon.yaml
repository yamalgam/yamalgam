testing:
  runner: just
  command: just test
  sources:
    - Justfile
    - .config/nextest.toml
  notes: "`just test` invokes `cargo nextest run`. Do not invoke `cargo test`
    directly: env-mutating tests assume nextest process isolation."
boundaries:
  - name: resource_identity
    description: URI references, file identities, base joining, and RFC 6901 fragments
    modules: [yamalgam-resolve]
    notes: Canonicalization and selection must precede recursion without leaking credentials.
  - name: filesystem_capability
    description: Capability-rooted retrieval, globbing, directory crawling, and symlink policy
    modules: [yamalgam-resolve]
    notes: Every selected path must remain inside the canonical configured root.
  - name: network_transport
    description: Host and scheme policy crossing into Librebar HTTP and TLS
    modules: [yamalgam-resolve, yamalgam]
    notes: Redirects, retries, credentials, cookies, and persistent cache state are disabled.
  - name: query_runtime
    description: Owned YAML conversion and typed resolver failures crossing the jaq boundary
    modules: [yamalgam-query, yamalgam]
    notes: Origins and session identity must survive query composition and multi-input execution.
