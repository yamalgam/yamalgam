                  let raw = self.next_resolution_key.get();
                  let next = raw.checked_add(1).ok_or_else(|| {
                      YgError::resource_overflow("resolution session key", "resolution session key overflow")
                  })?;
                  let key = ResolutionSessionKey(raw);
