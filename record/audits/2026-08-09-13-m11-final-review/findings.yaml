            start_line: 140
            end_line: 149
        evidence: |2
          pub fn jaq_error(error: ResolveError) -> jaq_core::Error<YamlVal> {
              let message = error.to_string();
              PENDING_ERROR.with(|pending| {
                  let mut pending = pending.borrow_mut();
                  if pending.is_none() {
