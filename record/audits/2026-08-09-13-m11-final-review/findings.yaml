  - slug: yaml-graph-integrity
    title: "YAML Anchor and Alias Integrity"
    thesis: "Imported fragments are renamed, but validation ignores YAML event order and prefix allocation ignores anchors already present in the output document."
    verdict: "Anchor isolation needs document-wide state. Validate aliases in event order, reserve every existing output anchor, and choose deterministic collision-free import prefixes before rewriting a selected subtree."
    flow:
      - id: select
        label: "Select referenced subtree"
        type: start
      - id: validate
        label: "Validate internal alias bindings"
        type: process
        findings:
