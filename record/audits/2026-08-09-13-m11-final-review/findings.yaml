---
audit_date: 2026-08-09
scope: "M11 external-resolution changes from c85f7e0 through 56b8b3e"
commit: 56b8b3ec9358dd3cac11a6cd22748d94c981ae59
assessment: |
  M11 establishes the right architecture: Yamalgam owns parsing and resolution,
  retrievers are pluggable, filesystem access is capability-rooted, and reports
  are structured. The final review nevertheless found contract gaps at the seams
  between URI and path interpretation, filesystem discovery, YAML anchor binding,
  report safety, and jaq runtime control flow. Ten significant findings can cause
  policy bypass, incorrect resolution, lost diagnostics, or unbounded work. Nine
  moderate findings affect determinism, public invariants, and runtime behavior. One
  advisory dependency is unused. The problems are concentrated and remediable;
  they do not require replacing the M11 design.

narratives:
  - slug: resource-identity-and-policy
    title: "Resource Identity and Policy Dispatch"
    thesis: "Canonical identities are the security hinge between URI resolution and capability-rooted files, but two dispatch paths cross that boundary incorrectly and the public representation does not enforce its own invariant."
    verdict: "The policy model is sound after an identity is classified. Classification itself needs to be closed: URI bases must use URI-reference rules before path rules, includes must reject every absolute URI form, and callers must not be able to construct noncanonical identities."
    flow:
      - id: directive
        label: "Read directive reference"
        type: start
      - id: classify
        label: "Classify URI or path"
        type: decision
        findings:
          - slug: scheme-relative-ref-becomes-local-file
            label: "Network path becomes file"
          - slug: include-uri-bypasses-relative-selector-contract
            label: "Absolute URI include"
      - id: identity
        label: "Construct canonical ResourceId"
        type: process
        findings:
          - slug: resource-id-public-variants-bypass-canonical-invariants
            label: "Invariant bypass"
      - id: policy
        label: "Apply capability policy"
        type: end
    findings:
      - slug: scheme-relative-ref-becomes-local-file
        title: "Scheme-relative URI references are misclassified as absolute file paths"
        concern: significant
        locations:
          - path: crates/yamalgam-resolve/src/resource.rs
            start_line: 275
            end_line: 282
        evidence: |2
              if let Ok(url) = Url::parse(reference) {
                  return ResourceId::from_url(url);
              }

              let path = Path::new(reference);
              if path.is_absolute() {
                  return Ok(ResourceId::from_file(path));
              }
        evidence_lang: rust
        evidence_markers:
          - lines: "1-7"
            type: mark
            label: "//host/path falls through URL parsing into the file branch"
        mechanism: |
          RFC 3986 network-path references such as //other.example/data.yaml are
          relative references that inherit the containing URL's scheme. Url::parse
          without a base rejects that form, then Path::is_absolute accepts it on
          Unix. Remotely supplied YAML can therefore move an HTTP ref onto the file
          capability instead of the host allowlist path.
        remediation: |
          Resolve all non-absolute references against a URI base with Url::join
          before applying platform path semantics. Interpret absolute paths only
          for file bases and cover network-path references under mixed policies.
        effort: small

      - slug: include-uri-bypasses-relative-selector-contract
        title: "URI-form include selectors bypass the relative-path restriction"
        concern: moderate
        locations:
          - path: crates/yamalgam-resolve/src/include.rs
            start_line: 252
            end_line: 259
        evidence: |2
              if Path::new(value)
                  .components()
                  .any(|component| matches!(component, Component::Prefix(_) | Component::RootDir))
              {
                  return Err(SessionError::MalformedInclude(
                      "include selector must be relative",
                  ));
              }
        evidence_lang: rust
        evidence_markers:
          - lines: "1-8"
            type: mark
            label: "Platform roots are rejected, URI schemes are not"
        mechanism: |
          Values such as file:///root/data.yaml and memory://fixture/data.yaml
          have no leading platform root component and pass directive validation.
          Resource resolution subsequently recognizes them as absolute identities,
          violating the accepted relative-only include contract.
        remediation: |
          Reject every absolute URI reference in path, glob, and directory include
          selectors before resource resolution. Retain normal platform-relative
          path syntax and add file, memory, and custom-scheme regressions.
        effort: small

      - slug: resource-id-public-variants-bypass-canonical-invariants
        title: "Public ResourceId variants bypass canonical identity invariants"
        concern: moderate
        locations:
          - path: crates/yamalgam-resolve/src/resource.rs
            start_line: 16
            end_line: 24
        evidence: |2
          #[non_exhaustive]
          pub enum ResourceId {
              /// A non-retrievable root with no relative external-resource base.
              Anonymous,
              /// A filesystem resource. Paths retain their platform-native encoding.
              File(PathBuf),
              /// A URL resource, including memory, HTTP, and application-defined schemes.
              Uri(Url),
          }
        evidence_lang: rust
        evidence_markers:
          - lines: "2-6"
            type: mark
            label: "Public payload variants bypass checked constructors"
        mechanism: |
          The type promises a normalized, fragmentless identity, but callers can
          construct ResourceId::File with dot segments or ResourceId::Uri with a
          fragment. Cache keys, cycle keys, and policy checks can then observe two
          representations for one resource or accept a fragmented fetch identity.
        remediation: |
          Make the representation private and expose only checked constructors and
          accessors. Preserve redacted Display and Debug behavior and add compile-time
          and runtime invariant coverage.
        effort: medium

  - slug: filesystem-retrieval-and-discovery
    title: "Filesystem Retrieval and Discovery"
    thesis: "Capability rooting prevents ambient escape, but pathname reopens, alias policy checks, recursive traversal, and backend ordering still leave correctness and resource-safety gaps."
