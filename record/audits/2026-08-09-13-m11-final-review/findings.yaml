        label: "Allocate import namespace"
        type: process
        findings:
          - slug: imported-anchor-prefix-can-collide-with-root
            label: "Prefix collision"
      - id: rewrite
        label: "Rewrite anchors and aliases"
        type: end
    findings:
      - slug: imported-anchor-prefix-can-collide-with-root
        title: "Predictable imported anchor prefixes can collide with existing root anchors"
        concern: significant
        locations:
          - path: crates/yamalgam-resolve/src/session.rs
            start_line: 1055
            end_line: 1056
        evidence: |2
                  let prefix = format!("yg_r{resource_ordinal}_e{edge_ordinal}_");
                  anchors::namespace(&mut selected, &prefix).map_err(|source| {
        evidence_lang: rust
        evidence_markers:
          - lines: "1-2"
            type: mark
            label: "Prefix is predictable and unreserved"
        mechanism: |
          A root anchor can already have the generated name for an imported anchor.
          YAML aliases bind to the most recent preceding definition, so an alias after
          substitution may silently switch from the root anchor to the imported node.
        remediation: |
          Inventory every anchor in the complete output root and prior imports. Select
          a deterministic prefix whose rewritten names do not intersect that set, then
          reserve the imported names.
        effort: medium

      - slug: fragment-self-containment-ignores-anchor-binding-order
        title: "Fragment self-containment checks names but not alias binding order"
        concern: moderate
        locations:
          - path: crates/yamalgam-resolve/src/anchors.rs
            start_line: 8
            end_line: 33
        evidence: |2
          pub fn namespace(node: &mut OwnedNode, prefix: &str) -> Result<(), SessionError> {
              let mut defined = HashSet::new();
              let mut used = HashSet::new();
              let mut pending = vec![&*node];
              while let Some(node) = pending.pop() {
                  if let Some(anchor) = &node.anchor {
                      defined.insert(anchor.clone());
                  }
                  match &node.kind {
                      OwnedKind::Alias { name } => {
                          used.insert(name.clone());
                      }
                      OwnedKind::Sequence { items, .. } => pending.extend(items),
                      OwnedKind::Mapping { entries, .. } => {
                          for (key, value) in entries {
                              pending.push(key);
                              pending.push(value);
                          }
                      }
                      OwnedKind::Scalar(_) => {}
                  }
              }

              if let Some(external) = used.iter().filter(|name| !defined.contains(*name)).min() {
                  return Err(SessionError::NonSelfContainedAlias(external.clone()));
              }
        evidence_lang: rust
        evidence_markers:
          - lines: "1-6"
            type: mark
            label: "Any later same-named anchor satisfies an earlier alias"
        mechanism: |
          YAML aliases bind to a preceding anchor, not any same-named anchor anywhere
          in the subtree. A fragment beginning with *a and defining &a later is accepted
          even though the selected alias depended on an external definition.
        remediation: |
          Traverse in emitted YAML event order, tracking anchors visible at each alias.
          Reject a use without an earlier in-subtree definition while preserving legal
          redefinition behavior.
        effort: small

