  - slug: yaml-bomb-materialized-by-emitters
    verdict: adjusted
    note: >
      Two corrections to the mechanism prose; the finding and its critical level stand.
      (1) "a seventh line reaches ~1.2 GB and an eighth exhausts memory" is off by one
      level and contradicts the paragraph's own 9x rule. Measured on this machine: 7 alias
      levels / 272 bytes produces 143 MB of JSON, 8 levels / 307 bytes produces 1.41 GB.
      Change to "a seventh line reaches ~120 MB and an eighth ~1.2 GB". (2) The --sort-keys
      claim needs a condition: with the bomb's keys already in a..g definition order,
      `yg -S . bomb.yml` emits 328 bytes, identical to unsorted. Rewriting the document so
      sorting moves aliases ahead of their anchors gives 39 MB from 272 bytes — so the
      sentence should read "when sorting moves an alias ahead of its anchor". Independently
      confirmed: --strict exits 0, and the subtree case (`yg '.g' bomb.yml`) yields 34 MB
      of YAML with anchors_emitted empty.

  - slug: filter-constructed-values-recurse-without-depth-bound
    verdict: adjusted
    note: >
      "Stack exhaustion aborts with SIGSEGV — not a catchable panic — so there is no
      message" is wrong on both the signal and the message. Measured:
      `yg -n 'reduce range(100000) as $i (null; [.]) | 1'` prints
      "thread 'main' (…) has overflowed its stack" and
      "fatal runtime error: stack overflow, aborting", then dies on SIGABRT (shell exit
      134). The substantive claims are unaffected and reproduce — not a catchable panic,
      exit code outside the documented set, no filename or document context — and the `| 1`
      variant independently confirms the recursive-drop path, since it aborts without ever
      emitting the deep value.

  - slug: map-index-allocates-directly-from-untrusted-index
    verdict: adjusted
    note: >
      The allocation-outcome claim does not match observed behaviour. Both
      `yg -n '.[1000000000000] = 1'` and `yg -n '"a" * 1000000000000'` hang indefinitely
      (killed at 60s) with no panic and no abort; str::repeat raises capacity overflow only
      when len*n overflows usize, which 1e12 on a 1-byte string does not. Replace "Vec
      allocation either raises a capacity-overflow panic or calls handle_alloc_error, which
      aborts" with the observed shape: the process wedges allocating and zeroing the
      request and, under overcommit, drives the OOM killer. Evidence, marker, and both
      secondary sites (valt.rs:240 resize, ops.rs:126 repeat) are correct, and the
      remediation is honest that the limit fields must be added.

  - slug: fromjson-ignores-configured-limits
    verdict: adjusted
    note: >
      "a 10 MB input cap" is wrong. LoaderConfig::moderate() sets max_input_bytes = 256 MB
      (crates/yamalgam-core/src/loader.rs:59-64); depth 256 and 10,000 alias expansions are
      correct as stated. Evidence, markers, the resolve comparison at funs.rs:154, and the
      remediation all check out — RunCtx.config is a Clone LoaderConfig and
      with_tag_resolution exists, and the note that fromjson's signature must grow cv is
      accurate.

