    note: >
      Two corrections. (1) "every numeric-position API routes through as_int … ValT::index
      (valt.rs:90)" — line 90 does not call as_int; it pattern-matches
      `(Data::Seq(items), Data::Int(position))` inline. as_int is reached at valt.rs:178 and
