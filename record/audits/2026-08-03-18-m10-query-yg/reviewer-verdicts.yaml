      the same rule, which strengthens the "duplicated with no shared helper" point.
      (2) The `.[0:(length/2)]` example does not demonstrate the integral-float gap: on
      odd-length input the bound is 1.5, and the proposed fix (accept Data::Float where
      f.fract() == 0.0) would still reject it — jq passes only because it truncates. Either
