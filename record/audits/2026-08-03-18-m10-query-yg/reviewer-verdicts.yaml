  - slug: env-filter-registered-unconditionally
    verdict: adjusted
    note: >
      The remediation cannot be implemented as written. In jaq-std 3.0.1, std(), format(),
      math(), regex(), time() and log() are all private (src/lib.rs:460, 482, 518, 612,
      625, 663); only funs(), base_funs() and extra_funs() are pub. "assembled from
      base_funs plus the individual format/math/regex groups" is therefore unreachable from
      outside the crate. The implementable options are base_funs() alone (which drops
      format/math/regex/time/log wholesale), filtering the all_funs() iterator by Fun name
      to remove env and now, or patching jaq-std. Recommend the name-filter approach and
      revise effort_notes, which currently names only std() as the unexposed item. Evidence,
      marker, the funs() = base_funs().chain(extra_funs()) composition, and the
      `SECRET=hunter2 yg -n 'env.SECRET'` transcript are all correct, as is the note that
      jaq's module loader is left at its rejecting default (verified at
      jaq-core-3.1.0/src/load/mod.rs:194).

  - slug: no-public-read-access-to-yamlval
    verdict: adjusted
    note: >
      Concern is inflated: significant should be advisory. Every factual claim verifies —
      exactly the nine public read accessors listed, seven public constructors, Data pub at
      value.rs:44 and YgMap pub at value.rs:39 with neither re-exported from lib.rs:24-27,
      and YamlVal.data pub(crate) so no external caller can reach a variant. But there is no
      runtime risk of any kind, and the narrative's own verdict says "Nothing here is broken
      today", which is the advisory definition ("not a vulnerability, but limits future
      safety") rather than significant ("meaningful risk under realistic conditions"). The
      argument for fixing it before M11 is sound and survives the relabel.

