testing:
  runner: just
  command: just test
  sources:
    - .config/scrat.toml
  notes: "`.config/nextest.toml` is present — the wrapper command likely invokes `cargo nextest run`.
    Do not invoke `cargo test` directly: env-mutating tests assume nextest process isolation."
boundaries:
  - name: untrusted_yaml_input
    description: "YAML documents read from files or stdin, parsed into YamlVal via the event builder"
    modules: [yamalgam-query]
    notes: "build.rs consumes parser events; unbounded alias/anchor expansion and recursion depth are the risk surface (Billion Laughs)"

  - name: user_supplied_filter_program
    description: "jq-syntax filter text compiled and executed by jaq-core 3.0"
    modules: [yamalgam-query, yamalgam]
    notes: "engine.rs compiles arbitrary user programs; native funs in funs.rs expand the reachable surface beyond jq-std"

  - name: filesystem_writes
    description: "In-place document editing writes results back over the input file"
    modules: [yamalgam]
    notes: "commands/query.rs --in-place path; atomicity, permission preservation, and symlink handling are the concerns"

  - name: serialization_output
    description: "YamlVal rendered back to YAML or JSON text"
    modules: [yamalgam-query]
    notes: "emit/yaml.rs quoting engine must produce re-parseable output for every scalar it can receive; emit/json.rs must handle YAML-only types"

  - name: process_exit_contract
    description: "CLI exit codes and stream separation consumed by shell pipelines"
    modules: [yamalgam]
    notes: "main.rs maps errors to exit codes 1-5; jq compatibility claims depend on this mapping"
